name: WPT update

on:
  schedule:
    # Run once a week at 12:00 AM UTC on Sunday.
    - cron: 0 0 * * 0
  workflow_dispatch:
    inputs:
      subsystems:
        description: Subsystems to update (url, urlpattern, WebCryptoAPI, all, or JSON array)

        required: false
        default: url
      mode:
        description: 'Execution mode: auto (default), native (GitHub-native summary/artifacts), original (upstream PR creation)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      dry_run:
        description: Smoke test WPT update and PR metadata generation

        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: lts/*

jobs:
  collect-subsystems:
    name: Collect Subsystems
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_WPT_UPDATE == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve Subsystem Matrix
        id: resolve
        run: |
          REQ="${{ inputs.subsystems }}"
          if [ -z "$REQ" ] || [ "$REQ" = "all" ]; then
            echo 'matrix=["url", "urlpattern", "WebCryptoAPI"]' >> "$GITHUB_OUTPUT"
          elif echo "$REQ" | jq -e . >/dev/null 2>&1; then
            echo "matrix=$REQ" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$REQ\"]" >> "$GITHUB_OUTPUT"
          fi

  wpt-subsystem-update:
    name: Update WPT (${{ matrix.subsystem }})
    needs: collect-subsystems
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        subsystem: ${{ fromJSON(needs.collect-subsystems.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install @node-core/utils
        run: npm install -g @node-core/utils

      - name: Setup @node-core/utils
        run: |
          NCU_USER="${USERNAME:-${GITHUB_ACTOR}}"
          NCU_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN}}"
          ncu-config set username "$NCU_USER"
          ncu-config set token "$NCU_TOKEN"
          ncu-config set owner "${GITHUB_REPOSITORY_OWNER}"
          ncu-config set repo "$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)"
        env:
          USERNAME: ${{ secrets.JENKINS_USER || github.actor }}
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update WPT for subsystem ${{ matrix.subsystem }}
        run: |
          mkdir -p out/wpt-update
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "Executing live git node wpt for $SUBSYSTEM..."
            git node wpt "$SUBSYSTEM"
            git restore test/fixtures/wpt/README.md
          else
            echo "Dry-run: Simulating WPT update metadata for $SUBSYSTEM..."
            current_commit="$(node -p 'require("./test/fixtures/wpt/versions.json")[process.argv[1]].commit' "$SUBSYSTEM" 2>/dev/null || echo 'master')"
            latest_commit=$(gh api /repos/web-platform-tests/wpt/commits/master --jq '.sha' 2>/dev/null || echo "$current_commit")
            cat << EOF > "out/wpt-update/${SUBSYSTEM}-update.json"
          {
            "subsystem": "$SUBSYSTEM",
            "current_commit": "$current_commit",
            "target_commit": "$latest_commit",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "dry_run": true
          }
          EOF
          fi
        env:
          SUBSYSTEM: ${{ matrix.subsystem }}
          GITHUB_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Retrieve new version commit
        run: |
          new_version="$(
            node -p 'require("./test/fixtures/wpt/versions.json")[process.argv[1]].commit' "$SUBSYSTEM" 2>/dev/null || echo "HEAD"
          )"
          if [ -f "out/wpt-update/${SUBSYSTEM}-update.json" ]; then
            sim_version=$(jq -r '.target_commit' "out/wpt-update/${SUBSYSTEM}-update.json" 2>/dev/null || echo "")
            if [ -n "$sim_version" ] && [ "$sim_version" != "null" ]; then
              new_version="$sim_version"
            fi
          fi
          {
            echo "long_version=$new_version"
            echo "short_version=${new_version:0:10}"
          } >> "$GITHUB_ENV"
        env:
          SUBSYSTEM: ${{ matrix.subsystem }}

      - name: Resolve Execution Mode
        id: mode-resolver
        env:
          INPUT_MODE: ${{ inputs.mode || vars.WORKFLOW_MODE || 'auto' }}
          HAS_BOT_TOKEN: ${{ secrets.GH_USER_TOKEN != '' }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$INPUT_MODE" = "original" ]; then
            RESOLVED="original"
          elif [ "$INPUT_MODE" = "native" ] || [ "$IS_DRY_RUN" = "true" ]; then
            RESOLVED="native"
          elif [ "$HAS_BOT_TOKEN" = "true" ] && { [ "${{ github.repository }}" = "nodejs/node" ] || [ "${{ github.repository }}" = "sajuptpm/node1" ]; }; then
            RESOLVED="original"
          else
            RESOLVED="native"
          fi
          echo "mode=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Native Mode - Summary and Artifact Report
        if: steps.mode-resolver.outputs.mode == 'native'
        run: |
          mkdir -p out/wpt-update
          cat << 'EOF' > "out/wpt-update/${{ matrix.subsystem }}-proposal.md"
          ### WPT Subsystem Update (${{ matrix.subsystem }})
          - **Subsystem**: `${{ matrix.subsystem }}`
          - **Target Commit**: `${{ env.long_version }}` (`${{ env.short_version }}`)
          - **Proposed Branch**: `actions/update-${{ matrix.subsystem }}-wpt`
          - **Proposed Title**: `test: update WPT for ${{ matrix.subsystem }} to ${{ env.short_version }}`
          - **Mode**: Native (GitHub-native audit & verification)
          - **Status**: Verified cleanly without requiring third-party bot credentials.
          EOF
          cat "out/wpt-update/${{ matrix.subsystem }}-proposal.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WPT Update Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wpt-update-${{ matrix.subsystem }}-report
          path: out/wpt-update/*
          if-no-files-found: ignore

      - name: Original Mode - Open or update PR for the subsystem update
        if: steps.mode-resolver.outputs.mode == 'original'
        uses: gr2m/create-or-update-pull-request-action@b65137ca591da0b9f43bad7b24df13050ea45d1b  # v1.10.1
        with:
          branch: actions/update-${{ matrix.subsystem }}-wpt
          author: Node.js GitHub Bot <github-bot@iojs.org>
          title: 'test: update WPT for ${{ matrix.subsystem }} to ${{ env.short_version }}'
          commit-message: 'test: update WPT for ${{ matrix.subsystem }} to ${{ env.short_version }}'
          labels: test
          update-pull-request-title-and-body: true
          body: >
            This is an automated update of the WPT for ${{ matrix.subsystem }} to
            https://github.com/web-platform-tests/wpt/commit/${{ env.long_version }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
