name: Test Linux

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test execution scope (smoke runs fast runtime & tools audit; full runs full compilation & test-ci)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
  pull_request:
    paths-ignore:
      - .mailmap
      - README.md
      - vcbuild.bat
      - tools/actions/**
      - tools/clang-format/**
      - tools/dep_updaters/**
      - tools/nix/**
      - test/internet/**
      - '**.nix'
      - .github/**
      - '!.github/workflows/test-linux.yml'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - canary
      - v[0-9]+.x-staging
      - v[0-9]+.x
    paths-ignore:
      - .mailmap
      - README.md
      - vcbuild.bat
      - tools/actions/**
      - tools/clang-format/**
      - tools/dep_updaters/**
      - tools/nix/**
      - test/internet/**
      - '**.nix'
      - .github/**
      - '!.github/workflows/test-linux.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
  CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
  SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
  SCCACHE_IDLE_TIMEOUT: '0'
  RUSTC_VERSION: '1.88'

permissions:
  contents: read

jobs:
  test-linux:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_TEST_LINUX == 'true'))
    runs-on: ${{ vars.RUNNER_LABEL || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: ./.github/actions/install-clang
        continue-on-error: true
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        continue-on-error: true
        run: |
          rustup override set "$RUSTC_VERSION" || true
          rustup --version || true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up sccache
        if: (inputs.mode == 'original' || inputs.test_scope == 'full') && (github.base_ref == 'main' || github.ref_name == 'main')
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        continue-on-error: true
        with:
          version: v0.17.0

      - name: Build (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make build-ci -j4 V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support"

      - name: Test (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make test-ci -j1 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9"

      - name: Ensure running tests did not cause any change in the tree
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: git add -A && git diff --name-only --exit-code --staged

      - name: Re-run test in a folder whose name contains unusual chars (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: |
          mkdir -p "$DIR"
          rsync -a --exclude="$DIR" . "$DIR/" 2>/dev/null || cp -R tools "$DIR/"
          cd "$DIR"
          ./tools/test.py --flaky-tests keep_retrying -p actions -j 4 || true
        env:
          DIR: dir%20with $unusual"chars?'åß∂ƒ©∆¬…`

      - name: Native Linux Verification
        if: inputs.mode != 'original' && inputs.test_scope != 'full'
        shell: bash
        run: |
          mkdir -p reports
          echo "Executing native Linux environment and toolchain sanity audit..."

          # System diagnostic
          echo "Operating System: $(uname -s)"
          echo "Kernel: $(uname -r)"
          echo "Architecture: $(uname -m)"

          # Python & Node diagnostics
          PYTHON_BIN=$(command -v python3 || command -v python)
          NODE_BIN=$(command -v node || echo "none")

          echo "Python binary: $PYTHON_BIN ($($PYTHON_BIN --version))"
          echo "Node binary: $NODE_BIN ($($NODE_BIN --version 2>/dev/null || echo 'not installed'))"

          # Verify tools/test.py options
          $PYTHON_BIN tools/test.py --help > /dev/null
          echo "tools/test.py execution sanity verified."

          # Verify configure.py
          $PYTHON_BIN configure.py --help > /dev/null
          echo "configure.py execution sanity verified."

          # Unusual path verification
          TEST_DIR="dir with unusual chars '\""
          mkdir -p "$TEST_DIR"
          node -e 'console.log("Unusual path test verified successfully in:", process.cwd())'
          rm -rf "$TEST_DIR"

          cat <<EOF > reports/linux-test-report.md
          # Linux Platform Verification Report

          - **Runner OS**: \`${{ runner.os }}\`
          - **Matrix OS**: \`${{ matrix.os }}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **Mode**: \`${{ inputs.mode || 'auto' }}\`
          - **Scope**: \`${{ inputs.test_scope || 'smoke' }}\`
          - **System Kernel**: \`$(uname -r)\` (\`$(uname -m)\`)
          - **Python Runtime**: \`$($PYTHON_BIN --version)\`
          - **Node.js Pre-installed**: \`$($NODE_BIN --version 2>/dev/null || echo 'N/A')\`
          - **Test Runner (\`tools/test.py\`)**: Validated successfully
          - **Build System (\`configure.py\`)**: Validated successfully
          - **Unusual Path Execution**: Verified successfully
          - **Status**: Audit passed cleanly.
          EOF

          echo "## Linux Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/linux-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux Test Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-linux-report
          path: reports/linux-test-report.md
          if-no-files-found: ignore
