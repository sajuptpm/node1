# This action requires the following secrets to be set on the repository:
#   GH_USER_TOKEN: GitHub user token, used because FIRST_TIMER and
#                  FIRST_TIME_CONTRIBUTOR associations are only returned for
#                  privileged API calls

name: Contributor guidance

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to evaluate

        required: false
        default: 1
        type: string
      is_first_time:
        description: Simulate first-time contributor

        required: false
        default: true
        type: boolean
      simulate_caution:
        description: Simulate AgentScan automation caution flag

        required: false
        default: false
        type: boolean
      dry_run:
        description: Simulate guidance without posting comments to GitHub

        required: false
        default: true
        type: boolean
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

permissions: {}

jobs:
  contributor:
    name: Resolve contributor status
    # Avoid allocating a runner unless a welcome or scan is a plausible outcome.
    if: >-
      (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_CONTRIBUTOR_GUIDANCE == 'true') &&
      github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.user.type != 'Bot' &&
        (github.event.pull_request.author_association == 'CONTRIBUTOR' ||
         github.event.pull_request.author_association == 'FIRST_TIMER' ||
         github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
         github.event.pull_request.author_association == 'NONE')))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      is_first_time: ${{ steps.resolve.outputs.is_first_time }}
      # The event association may not expose private organization membership,
      # so gate the guidance job on the privileged API result.
      should_scan: ${{ steps.resolve.outputs.should_scan }}
      association: ${{ steps.resolve.outputs.association }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      mode: ${{ steps.resolve.outputs.mode }}
      simulate_caution: ${{ steps.resolve.outputs.simulate_caution }}
    steps:
      - name: Check author association
        id: resolve
        env:
          EVENT_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || github.token }}
        run: |
          INPUT_MODE="${{ inputs.mode || 'auto' }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="true"
          fi
          SIM_CAUTION="${{ inputs.simulate_caution }}"
          if [ -z "$SIM_CAUTION" ]; then
            SIM_CAUTION="false"
          fi

          if [ "$INPUT_MODE" = "native" ]; then
            RESOLVED_MODE="native"
          elif [ "$INPUT_MODE" = "original" ]; then
            RESOLVED_MODE="original"
          else
            # auto mode
            if [ -n "${{ secrets.GH_USER_TOKEN }}" ] && [ "$DRY_RUN" != "true" ] && [ "${{ github.event_name }}" = "pull_request_target" ]; then
              RESOLVED_MODE="original"
            else
              RESOLVED_MODE="native"
            fi
          fi

          NUMBER="${{ inputs.pr_number || github.event.pull_request.number || '1' }}"
          echo "Target PR number: $NUMBER"

          api_association=""
          if [ -n "$NUMBER" ] && [ "$NUMBER" != "0" ]; then
            api_association=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.author_association' 2>/dev/null || echo "")
          fi
          echo "API author association query result: $api_association"
          echo "Event author association: $EVENT_ASSOCIATION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.is_first_time }}" = "true" ]; then
              api_association="FIRST_TIME_CONTRIBUTOR"
              echo "Workflow dispatch override: treating author association as FIRST_TIME_CONTRIBUTOR"
            elif [ -z "$api_association" ]; then
              api_association="CONTRIBUTOR"
            fi
          elif [ -z "$api_association" ]; then
            api_association="FIRST_TIME_CONTRIBUTOR"
          fi

          case "$api_association" in
            FIRST_TIMER|FIRST_TIME_CONTRIBUTOR)
              echo 'is_first_time=true' >> "$GITHUB_OUTPUT"
              echo 'should_scan=true' >> "$GITHUB_OUTPUT"
              ;;
            CONTRIBUTOR|NONE)
              echo 'is_first_time=false' >> "$GITHUB_OUTPUT"
              echo 'should_scan=true' >> "$GITHUB_OUTPUT"
              ;;
            COLLABORATOR|MANNEQUIN|MEMBER|OWNER)
              echo 'is_first_time=false' >> "$GITHUB_OUTPUT"
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo 'should_scan=true' >> "$GITHUB_OUTPUT"
              else
                echo 'should_scan=false' >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Unexpected author association: $api_association, defaulting to should_scan=true"
              echo 'is_first_time=true' >> "$GITHUB_OUTPUT"
              echo 'should_scan=true' >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "association=$api_association" >> "$GITHUB_OUTPUT"
          echo "pr_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
          echo "simulate_caution=$SIM_CAUTION" >> "$GITHUB_OUTPUT"

  guidance:
    name: Apply contributor guidance
    needs: contributor
    if: needs.contributor.outputs.should_scan == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Scan contributor activity
        id: agentscan
        if: github.event_name == 'pull_request_target'
        # The welcome should still be posted if this advisory scan fails.
        continue-on-error: true
        uses: MatteoGabriele/agentscan-action@8112fb79b33fafb8506159df20129a34209ac410  # v2.5.0
        with:
          github-token: ${{ github.token }}
          mode: labels
          scan-pull-requests: true
          scan-issues: false
          auto-close: false
          honeypot: false

      - name: Render Guidance & Generate Evaluation Report
        id: render_guidance
        env:
          ADD_CAUTION: >-
            ${{
              steps.agentscan.outputs.classification == 'mixed' ||
              steps.agentscan.outputs.classification == 'automation' ||
              steps.agentscan.outputs['community-flagged'] == 'true' ||
              needs.contributor.outputs.simulate_caution == 'true'
            }}
          IS_FIRST_TIME: ${{ needs.contributor.outputs.is_first_time }}
          ASSOCIATION: ${{ needs.contributor.outputs.association }}
          NUMBER: ${{ needs.contributor.outputs.pr_number }}
          DRY_RUN: ${{ needs.contributor.outputs.dry_run }}
          MODE: ${{ needs.contributor.outputs.mode }}
          USER_LOGIN: ${{ github.event.pull_request.user.login || github.actor }}
          WELCOME_MESSAGE: >2-
              Welcome to Node.js, and thank you for your first contribution!

            Before review, please take a moment to read:

              * the [guide for first-time contributors](https://github.com/nodejs/node/blob/HEAD/doc/contributing/first-contributions.md)
              * the [contribution and automation policies](https://github.com/nodejs/node/blob/HEAD/CONTRIBUTING.md)
              * the [pull request guide](https://github.com/nodejs/node/blob/HEAD/doc/contributing/pull-requests.md)
              * the [AI use policy](https://github.com/nodejs/node/blob/HEAD/doc/contributing/ai-guidelines.md)
              * the [Code of Conduct](https://github.com/nodejs/admin/blob/HEAD/CODE_OF_CONDUCT.md)

            Please make sure every commit is
            [signed off](https://github.com/nodejs/node/blob/HEAD/doc/contributing/pull-requests.md#step-4-commit).
            For a first pull request, GitHub Actions require collaborator
            approval and Jenkins CI must be started by a collaborator or triager,
            so an initial wait is normal.
          CAUTION_MESSAGE: >-
            > [!CAUTION]

            > AgentScan found account activity patterns that may be consistent with
            automation. This is a heuristic, not proof that this pull request was
            opened by an agent or violates policy. AI-assisted contributions are
            permitted, but automated tooling must not open pull requests without
            advance approval, and contributors must personally understand, test,
            verify, and take responsibility for every submitted change. See the
            [AgentScan analysis](https://agentscan.tools/user/${{ github.event.pull_request.user.login || github.actor }}),
            [AI use policy](https://github.com/nodejs/node/blob/HEAD/doc/contributing/ai-guidelines.md),
            and
            [automation policy](https://github.com/nodejs/node/blob/HEAD/CONTRIBUTING.md#automation-and-bots)
            for additional context.
        run: |
          mkdir -p reports
          should_comment="false"
          if [[ "$IS_FIRST_TIME" == "true" && "$ADD_CAUTION" == "true" ]]; then
            body="$WELCOME_MESSAGE"$'\n\n'"$CAUTION_MESSAGE"
            should_comment="true"
          elif [[ "$IS_FIRST_TIME" == "true" ]]; then
            body="$WELCOME_MESSAGE"
            should_comment="true"
          elif [[ "$ADD_CAUTION" == "true" ]]; then
            body="$CAUTION_MESSAGE"
            should_comment="true"
          else
            body="No guidance comment required for author association: $ASSOCIATION"
          fi

          cat << 'EOF' > generate_report.py
          import os

          mode = os.environ.get("MODE", "native")
          dry_run = os.environ.get("DRY_RUN", "true")
          pr_num = os.environ.get("NUMBER", "1")
          is_first = os.environ.get("IS_FIRST_TIME", "false")
          add_caution = os.environ.get("ADD_CAUTION", "false").strip()
          user_login = os.environ.get("USER_LOGIN", "")
          assoc = os.environ.get("ASSOCIATION", "")
          should_comment = os.environ.get("SHOULD_COMMENT", "false")
          body = os.environ.get("GUIDANCE_BODY", "")

          report = []
          report.append("# Contributor Guidance Evaluation Report\n")
          report.append("| Parameter | Value |")
          report.append("| :--- | :--- |")
          report.append(f"| **Target PR** | `#{pr_num}` |")
          report.append(f"| **Contributor Login** | `{user_login}` |")
          report.append(f"| **Author Association** | `{assoc}` |")
          report.append(f"| **Execution Mode** | `{mode}` |")
          report.append(f"| **Dry Run** | `{dry_run}` |")
          report.append(f"| **First Time Contributor** | `{is_first}` |")
          report.append(f"| **AgentScan Automation Caution** | `{add_caution}` |")
          report.append(f"| **Guidance Comment Action** | `{'Rendered' if should_comment == 'true' else 'Not Needed'}` |\n")

          report.append("## Guidance Content Preview\n")
          report.append("```markdown")
          report.append(body)
          report.append("```\n")

          if should_comment == "true":
              if dry_run == "true" or mode == "native":
                  report.append("ℹ️ **Simulation Mode**: The guidance comment was rendered and verified without modifying the pull request.")
              else:
                  report.append(f"✅ **Posted Live**: Comment delivered to PR `#{pr_num}`.")
          else:
              report.append(f"ℹ️ Author association `{assoc}` did not require onboarding guidance or automation caution.")

          content = "\n".join(report) + "\n"
          with open("reports/contributor-guidance-report.md", "w", encoding="utf-8") as f:
              f.write(content)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(content)
          EOF

          export SHOULD_COMMENT="$should_comment"
          export GUIDANCE_BODY="$body"
          python3 generate_report.py
          echo "should_comment=$should_comment" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_ENV"
          echo "$body" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Post Comment to PR (Original Live Mode)
        if: steps.render_guidance.outputs.should_comment == 'true' && needs.contributor.outputs.dry_run != 'true' && needs.contributor.outputs.mode == 'original'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ needs.contributor.outputs.pr_number }}
        run: |
          printf '%s\n' "$body" |
            gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -

      - name: Upload Contributor Guidance Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contributor-guidance-report
          path: reports/contributor-guidance-report.md
          if-no-files-found: warn
