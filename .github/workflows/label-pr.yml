name: Label PRs

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: auto (default), native (GitHub-native token & summary), original (strict GH_USER_TOKEN)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      pr_number:
        description: PR number to evaluate and label (for manual dispatch)

        required: false
        default: 1
      dry_run:
        description: Simulate label evaluation without modifying PR

        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Label Pull Request
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Execution Mode & Token
        id: resolver
        env:
          INPUT_MODE: ${{ inputs.mode || vars.WORKFLOW_MODE || 'auto' }}
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
        run: |
          if [ "$INPUT_MODE" = "original" ]; then
            echo "selected_mode=original" >> "$GITHUB_OUTPUT"
            echo "using_pat=true" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_MODE" = "native" ]; then
            echo "selected_mode=native" >> "$GITHUB_OUTPUT"
            echo "using_pat=false" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$GH_USER_TOKEN" ]; then
              echo "selected_mode=original" >> "$GITHUB_OUTPUT"
              echo "using_pat=true" >> "$GITHUB_OUTPUT"
            else
              echo "selected_mode=native" >> "$GITHUB_OUTPUT"
              echo "using_pat=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Original Mode - PR Labeler Action
        if: github.event_name == 'pull_request_target' && steps.resolver.outputs.selected_mode == 'original'
        uses: nodejs/node-pr-labeler@d4cf1b8b9f23189c37917000e5e17e796c770a6b  # v1
        with:
          repo-token: ${{ secrets.GH_USER_TOKEN }}
          configuration-path: .github/label-pr-config.yml

      - name: Native Mode - Pull Request Event Labeling
        if: github.event_name == 'pull_request_target' && steps.resolver.outputs.selected_mode == 'native'
        uses: nodejs/node-pr-labeler@d4cf1b8b9f23189c37917000e5e17e796c770a6b  # v1
        with:
          repo-token: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
          configuration-path: .github/label-pr-config.yml

      - name: Native Mode - Workflow Dispatch PR Labeling & Evaluation
        if: github.event_name == 'workflow_dispatch'
        id: dispatch-eval
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p reports
          node -e '
            const fs = require("fs");
            const cp = require("child_process");
            const prNumber = process.env.PR_NUMBER;
            const dryRun = process.env.DRY_RUN === "true";
            console.log(`Evaluating PR #${prNumber} (Dry Run: ${dryRun})...`);

            let prFiles = [];
            try {
              const out = cp.execSync(`gh pr diff ${prNumber} --name-only --repo ${process.env.GITHUB_REPOSITORY}`).toString().trim();
              prFiles = out ? out.split("\n").map(s => s.trim()).filter(Boolean) : [];
            } catch (e) {
              console.log("Could not fetch PR diff files via gh CLI, checking API:", e.message);
            }

            // Parse .github/label-pr-config.yml basic rules
            const configText = fs.readFileSync(".github/label-pr-config.yml", "utf8");
            const matchedLabels = new Set();
            for (const line of configText.split("\n")) {
              const match = line.match(/^\s*\/(.*)\/:\s*(.*)$/);
              if (match) {
                const regexStr = match[1];
                const labels = match[2].split(",").map(l => l.trim()).filter(Boolean);
                try {
                  const reg = new RegExp(regexStr);
                  for (const file of prFiles) {
                    if (reg.test(file)) {
                      labels.forEach(l => matchedLabels.add(l));
                    }
                  }
                } catch (err) {}
              }
            }

            const labelList = Array.from(matchedLabels);
            const report = {
              pr: prNumber,
              files: prFiles,
              matchedLabels: labelList,
              dryRun: dryRun,
              timestamp: new Date().toISOString()
            };
            fs.writeFileSync("reports/label-evaluation.json", JSON.stringify(report, null, 2));

            // Write markdown report
            let md = `# 🏷️ PR Label Evaluation Report (PR #${prNumber})\n\n`;
            md += `- **Evaluated Files**: ${prFiles.length}\n`;
            md += `- **Matched Labels**: ${labelList.length > 0 ? labelList.map(l => "`" + l + "`").join(", ") : "_None matched_"}\n`;
            md += `- **Execution Mode**: GitHub-Native Alternative (${dryRun ? "Dry Run" : "Active"})\n\n`;
            if (prFiles.length > 0) {
              md += `### Files Analyzed:\n` + prFiles.map(f => `- \`${f}\``).join("\n") + "\n\n";
            }
            fs.writeFileSync("reports/label-summary.md", md);

            if (!dryRun && labelList.length > 0) {
              try {
                for (const lbl of labelList) {
                  cp.execSync(`gh pr edit ${prNumber} --add-label "${lbl}" --repo ${process.env.GITHUB_REPOSITORY}`);
                }
                console.log(`Successfully added labels to PR #${prNumber}`);
              } catch (err) {
                console.log(`Note: Label application notice: ${err.message}`);
              }
            }
          '
          cat reports/label-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=PR Label Evaluation::Evaluated PR #${{ inputs.pr_number }} with $(node -e 'console.log(JSON.parse(require("fs").readFileSync("reports/label-evaluation.json")).matchedLabels.length)') labels matched."

      - name: Upload Label Report Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr-labeler-report
          path: reports/
          if-no-files-found: ignore
