name: Close stalled issues and PRs

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      dry_run:
        description: Audit stalled issues and PRs without actually closing them

        required: false
        default: true
        type: boolean
      days_before_close:
        description: Days before closing stalled items

        required: false
        default: 30
        type: number
      operations_per_run:
        description: Max API operations per run

        required: false
        default: 100
        type: number

env:
  CLOSE_MESSAGE: >
    Closing this because it has stalled. Feel free to reopen if this issue/PR
    is still relevant, or to ping the collaborator who labelled it stalled if
    you have any questions.

permissions:
  contents: read

jobs:
  stale:
    name: Process Stalled Issues & PRs
    permissions:
      issues: write  # for actions/stale to close stale issues
      pull-requests: write  # for actions/stale to close stale PRs
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOSE_STALLED == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Resolve Execution Mode
        id: mode_resolver
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ -z "$DRY_RUN" ]; then
            if [ "$MODE" = "original" ]; then
              DRY_RUN="false"
            else
              DRY_RUN="true"
            fi
          fi

          if [ "$MODE" = "auto" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              RESOLVED_MODE="native"
            else
              RESOLVED_MODE="original"
            fi
          else
            RESOLVED_MODE="$MODE"
          fi

          echo "Selected mode: $MODE -> Resolved mode: $RESOLVED_MODE (dry_run=$DRY_RUN)"
          echo "RESOLVED_MODE=$RESOLVED_MODE" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"

      # Active GitHub-Native Audit & Summary Step
      - name: Audit Stalled Issues and PRs (Native Mode)
        if: env.RESOLVED_MODE == 'native' || env.DRY_RUN == 'true'
        shell: bash
        run: |
          echo "### Close Stalled Issues & PRs Audit Summary" > close-stalled-report.md
          echo "" >> close-stalled-report.md
          echo "- **Execution Mode**: \`$RESOLVED_MODE\`" >> close-stalled-report.md
          echo "- **Dry Run**: \`$DRY_RUN\`" >> close-stalled-report.md
          echo "- **Days Before Close Threshold**: \`${{ inputs.days_before_close || 30 }}\`" >> close-stalled-report.md
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%SZ')" >> close-stalled-report.md
          echo "" >> close-stalled-report.md

          echo "#### Stalled Pull Requests" >> close-stalled-report.md
          echo "| Number | Title | State | Updated At | Action |" >> close-stalled-report.md
          echo "| :--- | :--- | :--- | :--- | :--- |" >> close-stalled-report.md

          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "stalled" --state open --limit 20 --json number,title,updatedAt 2>/dev/null || echo "[]")
          pr_count=$(echo "$prs" | jq '. | length' 2>/dev/null || echo 0)
          if [ "$pr_count" -gt 0 ]; then
            echo "$prs" | jq -r '.[] | "| #\(.number) | \(.title | gsub("[\\|\n]"; " ")) | open | \(.updatedAt) | Would Close (Dry-Run) |"' >> close-stalled-report.md
          else
            echo "| — | *No open PRs labeled 'stalled'* | — | — | None |" >> close-stalled-report.md
          fi

          echo "" >> close-stalled-report.md
          echo "#### Stalled Issues" >> close-stalled-report.md
          echo "| Number | Title | State | Updated At | Action |" >> close-stalled-report.md
          echo "| :--- | :--- | :--- | :--- | :--- |" >> close-stalled-report.md

          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "stalled" --state open --limit 20 --json number,title,updatedAt 2>/dev/null || echo "[]")
          issue_count=$(echo "$issues" | jq '. | length' 2>/dev/null || echo 0)
          if [ "$issue_count" -gt 0 ]; then
            echo "$issues" | jq -r '.[] | "| #\(.number) | \(.title | gsub("[\\|\n]"; " ")) | open | \(.updatedAt) | Would Close (Dry-Run) |"' >> close-stalled-report.md
          else
            echo "| — | *No open issues labeled 'stalled'* | — | — | None |" >> close-stalled-report.md
          fi

          cat close-stalled-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Execute actions/stale in debug-only (dry-run) mode
      - name: Process Stale Items (Dry-Run Mode)
        if: env.RESOLVED_MODE == 'native' || env.DRY_RUN == 'true'
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-close: ${{ inputs.days_before_close || 30 }}
          stale-pr-label: stalled
          stale-issue-label: stalled
          close-issue-message: ${{ env.CLOSE_MESSAGE }}
          close-pr-message: ${{ env.CLOSE_MESSAGE }}
          only-labels: stalled
          operations-per-run: ${{ inputs.operations_per_run || 100 }}
          days-before-stale: -1
          debug-only: true

      # Execute actions/stale in live mutation mode (Original Mode)
      - name: Process Stale Items (Live Original Mode)
        if: env.RESOLVED_MODE == 'original' && env.DRY_RUN == 'false'
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-close: ${{ inputs.days_before_close || 30 }}
          stale-pr-label: stalled
          stale-issue-label: stalled
          close-issue-message: ${{ env.CLOSE_MESSAGE }}
          close-pr-message: ${{ env.CLOSE_MESSAGE }}
          only-labels: stalled
          operations-per-run: ${{ inputs.operations_per_run || 500 }}
          days-before-stale: -1
          debug-only: false

      - name: Upload Close Stalled Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: close-stalled-report
          path: close-stalled-report.md
          if-no-files-found: ignore
