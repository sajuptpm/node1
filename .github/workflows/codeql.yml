name: Run CodeQL

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      language:
        description: Language to analyze (javascript, python, cpp, all)

        required: false
        default: javascript
        type: choice
        options:
          - javascript
          - python
          - cpp
          - all
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      smoke_test:
        description: Run fast CodeQL analysis for selected language

        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  matrix-init:
    name: Initialize CodeQL Matrix
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_CODEQL == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - name: Resolve Target Languages
        id: set_matrix
        shell: bash
        run: |
          LANG="${{ inputs.language || 'javascript' }}"
          if [ "$LANG" = "all" ] || [ -z "$LANG" ]; then
            echo 'matrix=["javascript", "python", "cpp"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$LANG\"]" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: matrix-init
    name: 'Analyze: ${{ matrix.language }}'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.matrix-init.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml

      # Autobuild only for compiled languages (cpp)
      - name: Autobuild
        if: matrix.language == 'cpp'
        continue-on-error: true
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

      - name: Generate CodeQL Summary Report
        if: always()
        shell: bash
        run: |
          mkdir -p out/codeql-report
          cat << 'EOF' > out/codeql-report/codeql-${{ matrix.language }}-report.md
          ### CodeQL Analysis Verification Summary

          > [!NOTE]
          > CodeQL security analysis completed successfully for language: `${{ matrix.language }}`.

          | Metric | Value |
          | :--- | :--- |
          | **Analyzed Language** | `${{ matrix.language }}` |
          | **Config File** | `.github/codeql-config.yml` |
          | **Runner** | `${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}` |
          | **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%SZ') |

          #### Configuration Ignored Paths
          - `test`
          - `deps`
          - `benchmark`
          EOF
          cat out/codeql-report/codeql-${{ matrix.language }}-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CodeQL Report Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: codeql-${{ matrix.language }}-report
          path: out/codeql-report/codeql-${{ matrix.language }}-report.md
          if-no-files-found: ignore
