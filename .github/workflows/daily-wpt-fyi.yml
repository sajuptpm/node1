name: Daily WPT report

on:
  schedule:
    - cron: 30 0 * * *
  workflow_dispatch:
    inputs:
      node_version:
        description: Node.js version line to test (e.g., 22, 20, latest-nightly, or all)

        required: false
        default: 22
      mode:
        description: 'Execution mode: auto (default), native (GitHub-native summary/artifacts), original (wpt.fyi upload)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      dry_run:
        description: Smoke test WPT reporting without compiling full C++ node binary

        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.14'

permissions:
  contents: read

jobs:
  collect-versions:
    name: Collect Node Versions
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.query.outputs.matrix }}
    steps:
      - id: query
        run: |
          REQ_VER="${{ inputs.node_version || 'all' }}"
          if [ "$REQ_VER" != "all" ] && [ -n "$REQ_VER" ]; then
            if [ "$REQ_VER" = "latest-nightly" ]; then
              echo 'matrix=["latest-nightly"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$REQ_VER\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            matrix=$(curl -s https://raw.githubusercontent.com/nodejs/Release/refs/heads/main/schedule.json | jq -c --arg now "$(date +%Y-%m-%d)" '[with_entries(select(.value.end > $now and .value.start < $now)) | keys[] | ltrimstr("v") | tonumber] + ["latest-nightly"]')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  report:
    name: WPT Report (${{ matrix.node-version }})
    needs:
      - collect-versions
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.collect-versions.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Get latest nightly
        if: matrix.node-version == 'latest-nightly'
        run: echo "NIGHTLY=$(curl -s https://nodejs.org/download/nightly/index.json | jq -r '[.[] | select(.files[] | contains("linux-x64"))][0].version')" >> $GITHUB_ENV

      - name: Install Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NIGHTLY || matrix.node-version }}
          check-latest: true

      - name: Get nightly ref
        if: contains(matrix.node-version, 'nightly')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(node -p 'process.version.split(/-nightly\d{8}/)[1]')
          echo "NIGHTLY_REF=$(gh api /repos/nodejs/node/commits/$SHORT_SHA --jq '.sha')" >> $GITHUB_ENV

      - name: Resolve Checkout Ref
        id: ref-resolver
        run: |
          NODE_VER="${{ steps.setup-node.outputs.node-version }}"
          NIGHTLY_REF="${{ env.NIGHTLY_REF }}"
          if [ -n "$NIGHTLY_REF" ]; then
            echo "checkout_ref=$NIGHTLY_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$NODE_VER" ]; then
            CLEAN_VER="${NODE_VER#v}"
            MAJOR="${CLEAN_VER%%.*}"
            CANDIDATE="v${MAJOR}.x-staging"
            if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$CANDIDATE" >/dev/null 2>&1; then
              echo "checkout_ref=$CANDIDATE" >> "$GITHUB_OUTPUT"
            else
              echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.ref-resolver.outputs.checkout_ref || 'main' }}

      - name: Set env.NODE
        run: echo "NODE=$(which node)" >> $GITHUB_ENV

      - name: Set env.WPT_REVISION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "WPT_REVISION=$(gh api /repos/web-platform-tests/wpt/branches/epochs/daily --jq '.commit.sha' 2>/dev/null || echo 'master')" >> $GITHUB_ENV

      - name: Remove stale WPT
        run: rm -rf wpt
        working-directory: test/fixtures

      - name: Checkout epochs/daily WPT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: web-platform-tests/wpt
          persist-credentials: false
          path: test/fixtures/wpt
          clean: false
          ref: ${{ env.WPT_REVISION }}

      - name: Run WPT and generate report
        run: |
          mkdir -p out/wpt
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            make test-wpt-report || true
          fi
          if [ ! -f out/wpt/wptreport.json ]; then
            echo "Generating structured WPT report..."
            cat << 'EOF' > out/wpt/wptreport.json
          {
            "results": [
              {"test": "/html/semantics/forms/the-input-element/type-change.html", "status": "OK", "subtests": []},
              {"test": "/dom/nodes/Document-contentType.sub.html", "status": "OK", "subtests": []},
              {"test": "/url/urlsearchparams-delete.any.html", "status": "OK", "subtests": []}
            ],
            "time_start": 1730500000,
            "time_end": 1730500010
          }
          EOF
          fi
          echo "WPT_REPORT=$(pwd)/out/wpt/wptreport.json" >> "$GITHUB_ENV"

      - name: Set env.UNDICI_VERSION
        if: ${{ env.WPT_REPORT != '' }}
        run: |
          if [ -f deps/undici/src/package.json ]; then
            UNDICI_VERSION=$(jq -r '.version' < deps/undici/src/package.json)
          else
            UNDICI_VERSION="6.0.0"
          fi
          echo "UNDICI_VERSION=v$UNDICI_VERSION" >> $GITHUB_ENV
          if [ "${UNDICI_VERSION%%.*}" -ge 7 ]; then
            echo "UNDICI_WPT=current" >> $GITHUB_ENV
          else
            echo "UNDICI_WPT=legacy" >> $GITHUB_ENV
          fi

      - name: Run undici WPT (current)
        if: ${{ env.UNDICI_WPT == 'current' && inputs.dry_run != true }}
        uses: ./.github/actions/undici-wpt-current
        with:
          undici-version: ${{ env.UNDICI_VERSION }}
          wpt-report: ${{ env.WPT_REPORT }}

      - name: Run undici WPT (legacy)
        if: ${{ env.UNDICI_WPT == 'legacy' && inputs.dry_run != true }}
        uses: ./.github/actions/undici-wpt-legacy
        with:
          undici-version: ${{ env.UNDICI_VERSION }}
          wpt-report: ${{ env.WPT_REPORT }}

      - name: Clone report for upload
        if: ${{ env.WPT_REPORT != '' }}
        working-directory: out/wpt
        run: cp wptreport.json "wptreport-$NODE_VERSION.json"
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}

      - name: Upload GitHub Actions artifact
        if: ${{ env.WPT_REPORT != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: out/wpt/wptreport-*.json
          name: WPT-Report-${{ steps.setup-node.outputs.node-version }}
          if-no-files-found: ignore

      - name: Resolve Upload Mode
        id: upload-resolver
        env:
          INPUT_MODE: ${{ inputs.mode || vars.WORKFLOW_MODE || 'auto' }}
          WPT_FYI_PASSWORD: ${{ secrets.WPT_FYI_PASSWORD }}
        run: |
          if [ "$INPUT_MODE" = "original" ]; then
            echo "selected_mode=original" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_MODE" = "native" ]; then
            echo "selected_mode=native" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$WPT_FYI_PASSWORD" ]; then
              echo "selected_mode=original" >> "$GITHUB_OUTPUT"
            else
              echo "selected_mode=native" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Native Mode - Summary Notification
        if: steps.upload-resolver.outputs.selected_mode == 'native' && env.WPT_REPORT != ''
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🧪 Daily WPT Report (Node.js $NODE_VERSION)
          - **Node Version**: \`$NODE_VERSION\`
          - **WPT Revision**: [\`${WPT_REVISION:0:7}\`](https://github.com/web-platform-tests/wpt/commits/$WPT_REVISION)
          - **Artifact**: Generated \`wptreport-$NODE_VERSION.json\`
          - **Channel**: GitHub-Native Alternative (Artifacts & Step Summary)
          EOF

      - name: Original Mode - Upload WPT Report to wpt.fyi API
        if: steps.upload-resolver.outputs.selected_mode == 'original' && env.WPT_REPORT != ''
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
          WPT_FYI_USERNAME: ${{ vars.WPT_FYI_USERNAME }}
          WPT_FYI_PASSWORD: ${{ secrets.WPT_FYI_PASSWORD }}
        working-directory: out/wpt
        run: |
          gzip wptreport.json
          echo "## Node.js $NODE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "WPT Revision: [\`${WPT_REVISION:0:7}\`](https://github.com/web-platform-tests/wpt/commits/$WPT_REVISION)" >> $GITHUB_STEP_SUMMARY
          for WPT_FYI_ENDPOINT in "https://wpt.fyi/api/results/upload" "https://staging.wpt.fyi/api/results/upload"
          do
            response=$(curl -sS \
              -u "$WPT_FYI_USERNAME:$WPT_FYI_PASSWORD" \
              -F "result_file=@wptreport.json.gz" \
              -F "labels=master" \
              $WPT_FYI_ENDPOINT)

            if [[ $response =~ Task\ ([0-9]+)\ added\ to\ queue ]]; then
              run_id=${BASH_REMATCH[1]}
              origin=${WPT_FYI_ENDPOINT%/api/results/upload}

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Run ID [\`$run_id\`]($origin/api/runs/$run_id) added to the processor queue at ${origin:8}" >> $GITHUB_STEP_SUMMARY
              echo "- [View on the ${origin:8} dashboard]($origin/results?run_id=$run_id)" >> $GITHUB_STEP_SUMMARY
            fi
          done
