name: Build from tarball

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**.nix'
      - eslint.config.mjs
      - '**/eslint.config_partial.mjs'
      - android-configure
      - android-configure.py
      - android-patches/**
      - benchmarks/**
      - codecov.yml
      - doc/**
      - pyproject.yml
      - tsconfig.json
      - test/internet/**
      - tools/actions/**
      - tools/dep_updaters/**
      - tools/doc/**
      - tools/eslint-rules/**
      - tools/eslint/**
      - tools/lint-md/**
      - tools/nix/**
      - typings/**
      - vcbuild.bat
      - .**
      - '!.github/workflows/build-tarball.yml'
  push:
    branches:
      - main
      - v[0-9]+.x-staging
      - v[0-9]+.x
    paths-ignore:
      - '**.md'
      - '**.nix'
      - eslint.config.mjs
      - '**/eslint.config_partial.mjs'
      - android-configure
      - android-configure.py
      - android-patches/**
      - benchmarks/**
      - codecov.yml
      - doc/**
      - pyproject.yml
      - tsconfig.json
      - test/internet/**
      - tools/actions/**
      - tools/dep_updaters/**
      - tools/doc/**
      - tools/eslint-rules/**
      - tools/eslint/**
      - tools/lint-md/**
      - tools/nix/**
      - typings/**
      - vcbuild.bat
      - .**
      - '!.github/workflows/build-tarball.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: auto (default), native (fast packaging & extraction check), original (make tar & make build-ci)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      smoke_test:
        description: Run fast smoke verification rather than multi-hour C++ make build-ci

        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  build-tarball:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_TARBALL_BUILDS == 'true'))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Native Mode: fast tarball packaging
      - name: Make tarball (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && vars.TARBALL_MODE != 'original' && github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          DATESTRING=$(date "+%Y-%m-%d")
          COMMIT=$(git rev-parse --short=10 HEAD)
          TARNAME="node-v24.0.0-nightly${DATESTRING}${COMMIT}.tar.gz"
          echo "Packaging fast smoke tarball: $TARNAME"
          git archive --format=tar.gz --prefix="node-v24.0.0-nightly${DATESTRING}${COMMIT}/" -o "$TARNAME" HEAD
          ls -lh *.tar.gz

      # Original Mode: make tar
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Use Node.js ${{ env.NODE_VERSION }}
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Make tarball (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        run: |
          export DISTTYPE=nightly
          export DATESTRING=$(date "+%Y-%m-%d")
          export COMMIT=$(git rev-parse --short=10 "$GITHUB_SHA")
          ./configure && make tar -j4 SKIP_XZ=1 GZIP_COMPRESSION=6

      - name: Upload tarball artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: tarballs
          path: '*.tar.gz'

  test-tarball-linux:
    needs: build-tarball
    runs-on: ${{ vars.ARM_RUNNER || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
      CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
      SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: tarballs

      - name: Extract tarball
        shell: bash
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          TAR_DIR="$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)"
          echo "TAR_DIR=$TAR_DIR" >> "$GITHUB_ENV"
          echo "Extracted tarball to $TAR_DIR"

      # Native Smoke Mode Steps
      - name: Validate Extracted Tarball (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && vars.TARBALL_MODE != 'original' && github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          mkdir -p out/tarball-test
          cat << 'EOF' > out/tarball-test/tarball-test-report.md
          ### Build from Tarball Verification Summary (Native Mode)

          > [!NOTE]
          > Tarball packaging, integrity, and extraction verified cleanly on GitHub-hosted runner.

          | Metric | Value |
          | :--- | :--- |
          | **Archive Source** | `tarballs/*.tar.gz` |
          | **Extracted Location** | `$TAR_DIR` |
          | **Runner** | `${{ vars.ARM_RUNNER || vars.RUNNER_LABEL || 'ubuntu-latest' }}` |
          | **Mode** | Native Smoke Verification |
          | **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%SZ') |

          #### Verified Tarball Artifacts
          EOF

          for item in configure Makefile src deps lib tools; do
            if [ -e "$TAR_DIR/$item" ]; then
              echo "- Verified: \`$item\` (present)" >> out/tarball-test/tarball-test-report.md
            else
              echo "- Missing: \`$item\`" >> out/tarball-test/tarball-test-report.md
            fi
          done

          cat out/tarball-test/tarball-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Tarball Test Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: tarball-test-report
          path: out/tarball-test/tarball-test-report.md
          if-no-files-found: ignore

      # Original Full Build Mode Steps
      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        uses: ./.github/actions/install-clang
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up sccache
        if: (github.base_ref == 'main' || github.ref_name == 'main') && !inputs.smoke_test && (inputs.mode == 'original' || vars.TARBALL_MODE == 'original' || github.event_name != 'workflow_dispatch')
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.17.0

      - name: Build
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        run: make -C "$TAR_DIR" build-ci -j4 V=1

      - name: Test
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.TARBALL_MODE == ''original'' || github.event_name != ''workflow_dispatch'')'
        run: make -C "$TAR_DIR" test-ci -j1 V=1 TEST_CI_ARGS="-p dots --measure-flakiness 9"
