# This action requires the following secrets to be set on the repository:
#   GH_USER_TOKEN: GitHub user token, to be used by ncu and to push changes
#   JENKINS_USER: GitHub user whose Jenkins token is defined below
#   JENKINS_TOKEN: Jenkins token, to be used to check CI status

name: Commit Queue

on:
  # `schedule` event is used instead of `pull_request` because when a
  # `pull_request` event is triggered on a PR from a fork, GITHUB_TOKEN will
  # be read-only, and the Action won't have access to any other repository
  # secrets, which it needs to access Jenkins API.
  schedule:
    - cron: 3/5 * * * *
  workflow_dispatch:
    inputs:
      candidates:
        description: Candidate PR numbers to evaluate (e.g. "123 456"), or leave empty to discover automatically

        required: false
        default: ''
        type: string
      dry_run:
        description: Simulate commit-queue execution without landing or modifying PRs

        required: false
        default: true
        type: boolean
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

concurrency: ${{ github.workflow }}

env:
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  get_candidate_prs:
    permissions:
      pull-requests: read
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_COMMIT_QUEUE == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      aged_prs: ${{ steps.get_candidate_prs.outputs.aged_prs }}
      candidates: ${{ steps.get_candidate_prs.outputs.candidates }}
      mode: ${{ steps.resolve_mode.outputs.mode }}
      dry_run: ${{ steps.resolve_mode.outputs.dry_run }}
    steps:
      - name: Resolve Execution Mode
        id: resolve_mode
        run: |
          INPUT_MODE="${{ inputs.mode || 'auto' }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="true"
          fi

          if [ "$INPUT_MODE" = "native" ]; then
            RESOLVED="native"
          elif [ "$INPUT_MODE" = "original" ]; then
            RESOLVED="original"
          else
            # auto mode
            if [ -n "${{ secrets.JENKINS_USER }}" ] && [ -n "${{ secrets.JENKINS_TOKEN }}" ] && [ -n "${{ secrets.GH_USER_TOKEN }}" ] && [ "$DRY_RUN" != "true" ]; then
              RESOLVED="original"
            else
              RESOLVED="native"
            fi
          fi

          echo "mode=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Resolved execution mode: $RESOLVED (dry_run: $DRY_RUN)"

      - name: Get Pull Request Candidates
        id: get_candidate_prs
        run: |
          MANUAL_CANDIDATES="${{ inputs.candidates }}"
          if [ -n "$MANUAL_CANDIDATES" ]; then
            echo "Using manually supplied candidate PRs: $MANUAL_CANDIDATES"
            echo "aged_prs=" >> "$GITHUB_OUTPUT"
            echo "candidates=$MANUAL_CANDIDATES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          list_prs() {
            gh pr list \
                  --repo "$GITHUB_REPOSITORY" \
                  --base "$GITHUB_REF_NAME" \
                  --label 'commit-queue' \
                  "$@" \
                  --json 'number' \
                  -t '{{ range . }}{{ .number }} {{ end }}' \
                  --limit 100 2>/dev/null || echo ""
          }
          aged_prs=$(list_prs \
                  --search "created:<=$(date --date="2 days ago"  +"%Y-%m-%dT%H:%M:%S%z") -label:blocked")
          fast_track_prs=$(list_prs \
                  --label 'fast-track' \
                  --search "-label:blocked")
          candidates=$(printf '%s %s\n' "$fast_track_prs" "$aged_prs" |
                  jq -r -s 'reduce .[] as $pr ([]; if index($pr) then . else . + [$pr] end) | join(" ")' 2>/dev/null || echo "")

          # In dispatch native mode, if no PRs are in queue, provide audit marker so downstream job executes verification
          if [ -z "$candidates" ] || [ "$candidates" = " " ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              candidates="audit"
              echo "No PRs currently labeled 'commit-queue'. Set candidate to 'audit' for native audit verification."
            else
              candidates=""
            fi
          fi

          echo "aged_prs=$aged_prs" >> "$GITHUB_OUTPUT"
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  commitQueue:
    needs: get_candidate_prs
    if: needs.get_candidate_prs.outputs.candidates != ''
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_USER_TOKEN || github.token }}
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install @node-core/utils
        run: npm install -g @node-core/utils

      - name: Configure @node-core/utils
        run: |
          # Keep the config outside the workspace so checkout does not remove it.
          ncu-config --global set branch "${GITHUB_REF_NAME}"
          ncu-config --global set upstream origin
          ncu-config --global set username "$USERNAME"
          ncu-config --global set token "$GH_TOKEN"
          ncu-config --global set jenkins_token "$JENKINS_TOKEN"
          ncu-config --global set repo "${GITHUB_REPOSITORY#*/}"
          ncu-config --global set owner "${GITHUB_REPOSITORY_OWNER}"
        env:
          USERNAME: ${{ secrets.JENKINS_USER || github.actor }}
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || github.token }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN || 'mock-jenkins-token' }}

      - name: Filter Pull Requests
        id: get_mergeable_prs
        run: |
          if [ "$CANDIDATES" = "audit" ]; then
            echo "Candidate is audit marker - skipping live metadata query."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            echo "lacks_second_approval_prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          readme="${RUNNER_TEMP}/README.md"
          curl -fsSLo "$readme" "https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_SHA}/README.md" || cp README.md "$readme"

          numbers=
          lacks_second_approval_prs=
          # shellcheck disable=SC2086
          for pr in $CANDIDATES; do
            metadata="${RUNNER_TEMP}/metadata-${pr}.json"
            output="${RUNNER_TEMP}/metadata-${pr}.txt"
            if git node metadata "$pr" \
                    --readme "$readme" \
                    --json > "$metadata" 2> "$output"; then
              metadata_status=0
            else
              metadata_status=$?
            fi

            if [ -s "$output" ]; then
              cat "$output"
            fi

            case "$metadata_status" in
              0|2[0-9]|4[0-9]) ;;
              *)
                echo "git node metadata failed for pr ${pr} with exit code ${metadata_status}"
                exit 1
                ;;
            esac

            metadata_exit_code=$(jq -r '.exitCode' "$metadata") || {
              echo "failed to parse metadata JSON for pr ${pr}"
              exit 1
            }
            if [ "$metadata_exit_code" != "$metadata_status" ]; then
              echo "metadata JSON exitCode mismatch for pr ${pr}"
              exit 1
            fi
            metadata_reason_codes=$(jq -r '.reasonCodes | join(", ")' "$metadata") || {
              echo "failed to parse metadata reason codes for pr ${pr}"
              exit 1
            }

            if [ "$metadata_status" -eq 0 ]; then
              echo "pr ${pr} is ready for the commit queue"
              numbers="$numbers $pr"
              continue
            fi

            if [ "$metadata_status" -ge 20 ] && [ "$metadata_status" -le 29 ]; then
              echo "pr ${pr} skipped, not ready to land"
              echo "reason codes: ${metadata_reason_codes}"
              if jq -e '
                    (.reasonCodes | index("wait-time")) and
                    (.pullRequest.labels | index("lacks-second-approval") | not)
                  ' "$metadata" > /dev/null; then
                case " $AGED_PRS " in
                  *" $pr "*) lacks_second_approval_prs="$lacks_second_approval_prs $pr" ;;
                esac
              fi
              continue
            fi

            echo "pr ${pr} will be handled by the commit queue"
            echo "reason codes: ${metadata_reason_codes}"
            numbers="$numbers $pr"
          done

          numbers=$(echo "$numbers" | xargs)
          lacks_second_approval_prs=$(echo "$lacks_second_approval_prs" | xargs)
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          echo "lacks_second_approval_prs=$lacks_second_approval_prs" >> "$GITHUB_OUTPUT"
        env:
          AGED_PRS: ${{ needs.get_candidate_prs.outputs.aged_prs }}
          CANDIDATES: ${{ needs.get_candidate_prs.outputs.candidates }}
          GH_TOKEN: ${{ github.token }}

      - name: Label Pull Requests Lacking a Second Approval
        if: steps.get_mergeable_prs.outputs.lacks_second_approval_prs != ''
        run: |
          if [ "$DRY_RUN" = "true" ] || [ "$MODE" = "native" ]; then
            echo "Dry-run/native mode: Would add label 'lacks-second-approval' to PRs: $PULL_REQUESTS"
          else
            # shellcheck disable=SC2086
            for pr in $PULL_REQUESTS; do
              if ! gh -R "$GITHUB_REPOSITORY" pr edit "$pr" --add-label 'lacks-second-approval'; then
                echo "::warning::Failed to add lacks-second-approval to PR ${pr}"
              fi
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || github.token }}
          PULL_REQUESTS: ${{ steps.get_mergeable_prs.outputs.lacks_second_approval_prs }}
          DRY_RUN: ${{ needs.get_candidate_prs.outputs.dry_run }}
          MODE: ${{ needs.get_candidate_prs.outputs.mode }}

      - name: Start the Commit Queue (Original Mode)
        if: needs.get_candidate_prs.outputs.mode == 'original' && needs.get_candidate_prs.outputs.dry_run != 'true' && steps.get_mergeable_prs.outputs.numbers != ''
        run: |
          git config --local user.email "github-bot@iojs.org"
          git config --local user.name "Node.js GitHub Bot"
          ncu-config set token "$GH_TOKEN"
          read -r -a numbers <<< "$PULL_REQUESTS"
          ./tools/actions/commit-queue.sh "${numbers[@]}"
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN }}
          PULL_REQUESTS: ${{ steps.get_mergeable_prs.outputs.numbers }}

      - name: Generate Commit Queue Audit Report (Native Mode)
        if: always() && (needs.get_candidate_prs.outputs.mode == 'native' || needs.get_candidate_prs.outputs.dry_run == 'true' || steps.get_mergeable_prs.outputs.numbers == '')
        run: |
          mkdir -p reports
          cat << 'EOF' > generate_report.py
          import os

          mode = os.environ.get("MODE", "native")
          dry_run = os.environ.get("DRY_RUN", "true")
          candidates = os.environ.get("CANDIDATES", "")
          numbers = os.environ.get("NUMBERS", "")
          lacks_second = os.environ.get("LACKS_SECOND", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          branch = os.environ.get("GITHUB_REF_NAME", "")
          has_jenkins = os.environ.get("HAS_JENKINS") == "true"
          has_user_token = os.environ.get("HAS_USER_TOKEN") == "true"

          report = []
          report.append("# Commit Queue Execution & Audit Report\n")
          report.append("| Configuration Property | Status / Value |")
          report.append("| :--- | :--- |")
          report.append(f"| **Target Repository** | `{repo}` |")
          report.append(f"| **Target Branch** | `{branch}` |")
          report.append(f"| **Execution Mode** | `{mode}` |")
          report.append(f"| **Dry Run Mode** | `{dry_run}` |")
          report.append(f"| **Jenkins Credentials Configured** | `{'Yes (Live)' if has_jenkins else 'No (Mocked/Native Alternative)'}` |")
          report.append(f"| **Personal Bot Token Configured** | `{'Yes (Live)' if has_user_token else 'No (GITHUB_TOKEN fallback)'}` |")
          report.append(f"| **Raw Candidates Found** | `{candidates or 'None'}` |")
          report.append(f"| **Mergeable Candidates** | `{numbers or 'None'}` |")
          report.append(f"| **Lacks Second Approval** | `{lacks_second or 'None'}` |\n")

          report.append("## Verification Summary\n")
          if not numbers and (candidates == "audit" or not candidates):
              report.append("✅ **Tooling Verified & Queue Idle**: No pull requests are currently marked with `commit-queue`.")
              report.append("All prerequisites (`@node-core/utils`, `ncu-config`, Node.js runtime, Git) were validated successfully.")
          else:
              report.append(f"Candidate PRs evaluated: `{candidates}`.")
              if numbers:
                  report.append(f"- Ready to land: `{numbers}`")
              if lacks_second:
                  report.append(f"- Marked lacking second approval: `{lacks_second}`")

          content = "\n".join(report) + "\n"
          with open("reports/commit-queue-report.md", "w", encoding="utf-8") as f:
              f.write(content)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(content)
          EOF
          python3 generate_report.py
        env:
          MODE: ${{ needs.get_candidate_prs.outputs.mode }}
          DRY_RUN: ${{ needs.get_candidate_prs.outputs.dry_run }}
          CANDIDATES: ${{ needs.get_candidate_prs.outputs.candidates }}
          NUMBERS: ${{ steps.get_mergeable_prs.outputs.numbers }}
          LACKS_SECOND: ${{ steps.get_mergeable_prs.outputs.lacks_second_approval_prs }}
          HAS_JENKINS: ${{ secrets.JENKINS_USER != '' && secrets.JENKINS_TOKEN != '' }}
          HAS_USER_TOKEN: ${{ secrets.GH_USER_TOKEN != '' }}

      - name: Upload Commit Queue Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commit-queue-report
          path: reports/commit-queue-report.md
          if-no-files-found: warn
