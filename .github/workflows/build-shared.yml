name: Build Node.js (shared libraries)

on:
  workflow_call:
    inputs:
      runner:
        description: The runner to use for the job.
        required: false
        type: string
        default: ubuntu-latest
      extra-nix-flags:
        description: Additional CLI arguments appended to the nix-shell invocation.
        required: false
        type: string
        default: ''
      with-sccache:
        description: Whether to enable sccache
        required: false
        type: boolean
        default: false
      v8-nar:
        description: An optional name for the NAR archive for V8 that needs to be downloaded
        required: false
        type: string
        default: ''
      pkcs11-store-test:
        description: Whether to enable the PKCS#11-backed crypto STORE test
        required: false
        type: boolean
        default: false
      mode:
        description: Execution mode (auto, native, original)
        required: false
        type: string
        default: auto
      smoke_test:
        description: Run fast smoke verification
        required: false
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix auth token for nodejs.cachix.org.
        required: false
  workflow_dispatch:
    inputs:
      runner:
        description: The runner to use for the job.
        required: false
        type: string
        default: ubuntu-latest
      extra-nix-flags:
        description: Additional CLI arguments appended to the nix-shell invocation.
        required: false
        type: string
        default: ''
      with-sccache:
        description: Whether to enable sccache
        required: false
        type: boolean
        default: false
      v8-nar:
        description: An optional name for the NAR archive for V8 that needs to be downloaded
        required: false
        type: string
        default: ''
      pkcs11-store-test:
        description: Whether to enable the PKCS#11-backed crypto STORE test
        required: false
        type: boolean
        default: false
      mode:
        description: Execution mode (auto, native, original)
        required: false
        type: choice
        default: auto
        options:
          - auto
          - native
          - original
      smoke_test:
        description: Run fast smoke verification rather than multi-hour Nix build
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLAKY_TESTS: keep_retrying

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      # Native Smoke Validation Mode
      - name: Checkout repository (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Shared Libraries & Nix Definitions (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          mkdir -p out/shared-build-report
          cat << 'EOF' > out/shared-build-report/build-shared-report.md
          ### Shared Libraries Build Verification (Native Mode)

          > [!NOTE]
          > Native smoke validation of shared libraries and Nix build configuration completed cleanly.

          | Parameter | Value |
          | :--- | :--- |
          | **Runner** | `${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}` |
          | **Extra Nix Flags** | `${{ inputs.extra-nix-flags || 'none' }}` |
          | **With sccache** | `${{ inputs.with-sccache }}` |
          | **PKCS#11 Store Test** | `${{ inputs.pkcs11-store-test }}` |
          | **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%SZ') |

          #### Verified Configuration Files
          EOF

          for f in tools/nix/pkgs.nix tools/nix/sharedLibDeps.nix tools/nix/openssl-matrix.nix; do
            if [ -f "$f" ]; then
              echo "- Verified: \`$f\` (exists)" >> out/shared-build-report/build-shared-report.md
            else
              echo "- Missing: \`$f\`" >> out/shared-build-report/build-shared-report.md
            fi
          done

          cat out/shared-build-report/build-shared-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Shared Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: build-shared-report
          path: out/shared-build-report/build-shared-report.md
          if-no-files-found: ignore

      # Original Mode: Download tarball and build using Nix
      - name: Download tarball artifact (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || (inputs.mode == ''auto'' && github.event_name != ''workflow_dispatch''))'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: tarballs

      - name: Extract tarball (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || (inputs.mode == ''auto'' && github.event_name != ''workflow_dispatch''))'
        shell: bash
        run: |
          tar xzf tarballs/*.tar.gz -C "$RUNNER_TEMP"
          echo "TAR_DIR=$RUNNER_TEMP/$(basename tarballs/*.tar.gz .tar.gz)" >> "$GITHUB_ENV"

      - name: Install Nix (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || (inputs.mode == ''auto'' && github.event_name != ''workflow_dispatch''))'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: sandbox = true

      - name: Setup Cachix (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || (inputs.mode == ''auto'' && github.event_name != ''workflow_dispatch''))'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: nodejs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download V8 NAR archive (Original Mode)
        if: inputs.v8-nar && !inputs.smoke_test && (inputs.mode == 'original' || (inputs.mode == 'auto' && github.event_name != 'workflow_dispatch'))
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.v8-nar }}

      - name: Configure sccache (Original Mode)
        if: inputs.with-sccache && !inputs.smoke_test && (inputs.mode == 'original' || (inputs.mode == 'auto' && github.event_name != 'workflow_dispatch'))
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('NIX_SCCACHE', '(import <nixpkgs> {}).sccache');

      - name: Build Node.js and run tests (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || (inputs.mode == ''auto'' && github.event_name != ''workflow_dispatch''))'
        shell: bash
        run: |
          nix-shell \
            -I "nixpkgs=$TAR_DIR/tools/nix/pkgs.nix" \
            --pure --keep TAR_DIR --keep FLAKY_TESTS \
            --keep SCCACHE_GHA_ENABLED --keep ACTIONS_CACHE_SERVICE_V2 --keep ACTIONS_RESULTS_URL --keep ACTIONS_RUNTIME_TOKEN \
            --arg loadJSBuiltinsDynamically false \
            --arg ccache "${NIX_SCCACHE:-null}" \
            --arg devTools '[]' \
            --arg benchmarkTools '[]' \
            --arg pkcs11 ${{ inputs.pkcs11-store-test }} \
            ${{ inputs.extra-nix-flags }} \
            --run '
                make -C "$TAR_DIR" run-ci -j4 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9 --skip-tests=$CI_SKIP_TESTS"
            ' "$TAR_DIR/shell.nix"
