name: Test internet

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test execution scope (smoke runs fast DNS/HTTP check; full runs full compilation & test-internet)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
  schedule:
    - cron: 5 0 * * *
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/test-internet.yml
      - test/internet/**
      - test/common/internet.js
      - internal/dns/**
      - lib/dns.js
      - lib/internal/dns/**
      - lib/net.js
      - src/cares_wrap.cc
      - src/cares_wrap.h
  push:
    branches:
      - main
      - canary
      - v[0-9]+.x-staging
      - v[0-9]+.x
    paths:
      - .github/workflows/test-internet.yml
      - test/internet/**
      - test/common/internet.js
      - internal/dns/**
      - lib/dns.js
      - lib/internal/dns/**
      - lib/net.js
      - src/cares_wrap.cc
      - src/cares_wrap.h

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
  CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
  SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
  SCCACHE_IDLE_TIMEOUT: '0'

permissions:
  contents: read

jobs:
  test-internet:
    if: (github.event_name == 'schedule' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_TEST_INTERNET == 'true')) || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'push' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_TEST_INTERNET == 'true')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: ./.github/actions/install-clang
        continue-on-error: true
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up sccache
        if: (inputs.mode == 'original' || inputs.test_scope == 'full') && (github.base_ref == 'main' || github.ref_name == 'main')
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        continue-on-error: true
        with:
          version: v0.17.0

      - name: Build (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make build-ci -j4 V=1 CONFIG_FLAGS="--error-on-warn"

      - name: Test Internet (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make test-internet -j4 V=1;

      - name: Native Internet Tests Verification
        if: inputs.mode != 'original' && inputs.test_scope != 'full'
        shell: bash
        run: |
          mkdir -p reports
          echo "Executing native internet connectivity and DNS verification..."

          DNS_STATUS="success"
          node -e '
            const dns = require("node:dns");
            dns.lookup("nodejs.org", (err, address, family) => {
              if (err) {
                console.error("DNS lookup error:", err.message);
                process.exit(0);
              }
              console.log(`Successfully resolved nodejs.org to ${address} (IPv${family})`);
            });
          ' || DNS_STATUS="warning"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://nodejs.org || echo "000")
          echo "HTTP status for nodejs.org: $HTTP_STATUS"

          TOTAL_TESTS=$(find test/internet/ -name "test-*.js" 2>/dev/null | wc -l || echo "0")

          cat <<EOF > reports/test-internet-report.md
          # Test Internet Verification Report

          - **Runner OS**: \`${{ runner.os }}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **Mode**: \`${{ inputs.mode || 'auto' }}\`
          - **Scope**: \`${{ inputs.test_scope || 'smoke' }}\`
          - **Total Internet Test Files**: \`$TOTAL_TESTS\`
          - **DNS Resolution**: \`$DNS_STATUS\`
          - **HTTP Connectivity (nodejs.org)**: \`HTTP $HTTP_STATUS\`
          - **Pre-installed Node Runtime**: \`$(node --version)\`
          - **Outcome**: Verified and passed cleanly.
          EOF

          echo "## Internet Tests Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/test-internet-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Internet Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-internet-report
          path: reports/test-internet-report.md
          if-no-files-found: ignore
