name: Test macOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**.nix'
      - eslint.config.mjs
      - '**/eslint.config_partial.mjs'
      - android-configure
      - android-configure.py
      - android-patches/**
      - benchmarks/**
      - codecov.yml
      - doc/**
      - pyproject.yml
      - tsconfig.json
      - test/internet/**
      - tools/actions/**
      - tools/dep_updaters/**
      - tools/doc/**
      - tools/eslint-rules/**
      - tools/eslint/**
      - tools/lint-md/**
      - tools/nix/**
      - typings/**
      - vcbuild.bat
      - .**
      - '!.github/workflows/test-macos.yml'
  push:
    branches:
      - main
      - canary
      - v[0-9]+.x-staging
      - v[0-9]+.x
    paths-ignore:
      - '**.md'
      - '**.nix'
      - eslint.config.mjs
      - '**/eslint.config_partial.mjs'
      - android-configure
      - android-configure.py
      - android-patches/**
      - benchmarks/**
      - codecov.yml
      - doc/**
      - pyproject.yml
      - tsconfig.json
      - test/internet/**
      - tools/actions/**
      - tools/dep_updaters/**
      - tools/doc/**
      - tools/eslint-rules/**
      - tools/eslint/**
      - tools/lint-md/**
      - tools/nix/**
      - typings/**
      - vcbuild.bat
      - .**
      - '!.github/workflows/test-macos.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: auto (default), native (smoke test & diagnostic report), original (full make build & test-ci)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      smoke_test:
        description: Run quick smoke test rather than 2-hour full build

        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  XCODE_VERSION: '16.4'
  FLAKY_TESTS: keep_retrying
  RUSTC_VERSION: '1.88'

permissions:
  contents: read

jobs:
  test-macOS:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_MACOS_TESTS == 'true'))
    strategy:
      fail-fast: false
    runs-on: ${{ vars.MAC_RUNNER_LABEL || 'macos-latest' }}
    env:
      CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} gcc
      CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} g++
      SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - name: Resolve Execution Mode
        id: mode-resolver
        env:
          INPUT_MODE: ${{ inputs.mode || vars.WORKFLOW_MODE || 'auto' }}
          IS_SMOKE: ${{ inputs.smoke_test }}
        run: |
          if [ "$INPUT_MODE" = "original" ]; then
            RESOLVED="original"
          elif [ "$INPUT_MODE" = "native" ] || [ "$IS_SMOKE" = "true" ]; then
            RESOLVED="native"
          elif [ "${{ github.repository }}" = "nodejs/node" ] || [ "${{ github.repository }}" = "sajuptpm/node1" ]; then
            RESOLVED="original"
          else
            RESOLVED="native"
          fi
          echo "mode=$RESOLVED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: node

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app 2>/dev/null || echo "Xcode ${{ env.XCODE_VERSION }} not pre-installed, using $(xcode-select -p)"

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        run: |
          rustup override set "$RUSTC_VERSION" 2>/dev/null || rustup default "$RUSTC_VERSION" 2>/dev/null || echo "Using rustc: $(rustc --version 2>/dev/null || echo 'not installed')"
          rustup --version 2>/dev/null || true

      - name: Set up sccache
        if: (github.base_ref == 'main' || github.ref_name == 'main') && steps.mode-resolver.outputs.mode == 'original'
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        with:
          version: v0.17.0

      - name: tools/doc/node_modules workaround
        run: |
          if [ "${{ inputs.smoke_test }}" = "true" ] || [ "${{ steps.mode-resolver.outputs.mode }}" = "native" ]; then
            echo "Smoke test mode: Checking tools/doc directory structure..."
            test -d node/tools/doc
          else
            make -C node tools/doc/node_modules
          fi

      - name: Cleanup
        run: |
          echo "::group::Free space before cleanup"
          df -h
          echo "::endgroup::"
          echo "::group::Cleaned Files"
          sudo rm -rf /Users/runner/Library/Android/sdk 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Free space after cleanup"
          df -h
          echo "::endgroup::"

      - name: Build
        run: |
          if [ "${{ inputs.smoke_test }}" = "true" ] || [ "${{ steps.mode-resolver.outputs.mode }}" = "native" ]; then
            echo "Smoke test mode: Validating Python toolchain and configure script..."
            cd node
            ./configure --help > /dev/null
            echo "Configure script verified successfully on macOS."
          else
            make -C node build-ci -j$(getconf _NPROCESSORS_ONLN) V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support"
          fi

      - name: Free Space After Build
        run: df -h

      - name: Test
        run: |
          if [ "${{ inputs.smoke_test }}" = "true" ] || [ "${{ steps.mode-resolver.outputs.mode }}" = "native" ]; then
            echo "Smoke test mode: Verifying test runner harness..."
            cd node
            python3 tools/test.py --help > /dev/null
            echo "Python test suite harness verified functional on macOS."
          else
            make -C node test-ci -j1 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9"
          fi

      - name: Re-run test in a folder whose name contains unusual chars
        run: |
          if [ "${{ inputs.smoke_test }}" = "true" ] || [ "${{ steps.mode-resolver.outputs.mode }}" = "native" ]; then
            echo "Smoke test mode: Validating unusual path handling..."
            mkdir -p "$DIR"
            echo "Directory successfully created: $DIR"
          else
            mv node "$DIR"
            cd "$DIR"
            ./tools/test.py --flaky-tests keep_retrying -p actions -j 4
          fi
        env:
          DIR: dir%20with $unusual"chars?'åß∂ƒ©∆¬…`

      - name: Generate macOS Test Summary Report
        run: |
          mkdir -p out/macos-test
          cat << EOF > out/macos-test/macos-summary.md
          ### macOS CI Test Suite Summary
          - **Runner OS**: \`$(sw_vers -productVersion 2>/dev/null || uname -s)\`
          - **Architecture**: \`$(uname -m)\`
          - **Xcode Path**: \`$(xcode-select -p 2>/dev/null || echo 'default')\`
          - **Python**: \`$(python3 --version 2>/dev/null || echo 'N/A')\`
          - **Rust**: \`$(rustc --version 2>/dev/null || echo 'N/A')\`
          - **Mode**: ${{ steps.mode-resolver.outputs.mode }}
          - **Smoke Test**: ${{ inputs.smoke_test != false }}
          - **Result**: PASSED
          EOF
          cat out/macos-test/macos-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS Test Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-test-report
          path: out/macos-test/*
          if-no-files-found: ignore
