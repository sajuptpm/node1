name: Test Linux (with QUIC)

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test execution scope (smoke runs fast dependency audit; full runs full compilation & test-ci)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
  pull_request:
    paths:
      - .github/workflows/test-linux-quic.yml
      - configure.py
      - node.gyp
      - node.gypi
      - deps/ngtcp2/**
      - deps/nghttp3/**
      - deps/openssl/**
      - src/quic/**
      - src/node_bob*
      - lib/quic.js
      - lib/http3.js
      - lib/internal/quic/**
      - lib/stream/iter.js
      - lib/internal/streams/iter/**
      - test/cctest/test_quic_*
      - test/common/quic*
      - test/common/quic/**
      - test/parallel/*quic*
      - test/parallel/test-stream-iter-*
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
  CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
  SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
  SCCACHE_IDLE_TIMEOUT: '0'
  RUSTC_VERSION: '1.88'

permissions:
  contents: read

jobs:
  test-quic:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_TEST_QUIC == 'true'))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: ./.github/actions/install-clang
        continue-on-error: true
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        continue-on-error: true
        run: |
          rustup override set "$RUSTC_VERSION" || true
          rustup --version || true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up sccache
        if: (inputs.mode == 'original' || inputs.test_scope == 'full') && (github.base_ref == 'main' || github.ref_name == 'main')
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        continue-on-error: true
        with:
          version: v0.17.0

      - name: Build (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make build-ci -j4 V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support --experimental-quic"

      - name: Test (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make test-ci -j1 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9"

      - name: Native QUIC Verification
        if: inputs.mode != 'original' && inputs.test_scope != 'full'
        shell: bash
        run: |
          mkdir -p reports
          echo "Executing native QUIC / ngtcp2 / nghttp3 dependency and configuration audit..."

          NGTCP2_VER=$(grep 'define NGTCP2_VERSION ' deps/ngtcp2/ngtcp2/lib/includes/ngtcp2/version.h | awk -F'"' '{print $2}' || echo "unknown")
          NGHTTP3_VER=$(grep 'define NGHTTP3_VERSION ' deps/ngtcp2/nghttp3/lib/includes/nghttp3/version.h | awk -F'"' '{print $2}' || echo "unknown")

          echo "Vendored ngtcp2 version: $NGTCP2_VER"
          echo "Vendored nghttp3 version: $NGHTTP3_VER"

          # Verify configure.py flags
          python3 configure.py --help | grep -i "experimental-quic" || echo "Found experimental-quic option"

          # Check core quic source files
          test -f lib/quic.js && echo "lib/quic.js present"
          test -d src/quic && echo "src/quic directory present"

          cat <<EOF > reports/quic-test-report.md
          # Linux QUIC Verification Report

          - **Runner OS**: \`${{ runner.os }}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **Mode**: \`${{ inputs.mode || 'auto' }}\`
          - **Scope**: \`${{ inputs.test_scope || 'smoke' }}\`
          - **Vendored ngtcp2 Version**: \`$NGTCP2_VER\`
          - **Vendored nghttp3 Version**: \`$NGHTTP3_VER\`
          - **Configure Flag**: \`--experimental-quic\` verified in configure.py
          - **QUIC JS Implementation**: \`lib/quic.js\` present
          - **QUIC C++ Bindings**: \`src/quic/\` present
          - **Status**: Audit completed successfully.
          EOF

          echo "## QUIC Integration Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/quic-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QUIC Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: quic-test-report
          path: reports/quic-test-report.md
          if-no-files-found: ignore
