name: Benchmark

on:
  workflow_dispatch:
    inputs:
      repo:
        type: string
        required: false
        description: GitHub repository to fetch from (default to the current repo)
      pr_id:
        type: number
        required: false
        default: 0
        description: The PR to test (0 or empty to test repository default branch)
      commit:
        required: false
        type: string
        default: HEAD
        description: The expected HEAD of the PR
      category:
        required: false
        type: string
        default: misc
        description: The category (or categories) of tests to run, for example misc, buffers, cluster etc.
      filter:
        type: string
        required: false
        default: arguments
        description: A substring to restrict the benchmarks to run in a category. e.g. `arguments`
      runs:
        type: number
        required: false
        default: 1
        description: How many times to repeat each benchmark
      smoke_test:
        type: boolean
        required: false
        default: true
        description: Run fast GitHub-native smoke benchmark without rebuilding Node.js via Nix
      mode:
        type: choice
        required: false
        default: auto
        options:
          - auto
          - native
          - original
        description: Execution mode (auto, native, or original)
      post-comment:
        type: boolean
        required: false
        default: false
        description: Post a comment linking to the run, with the aggregated result once known.
      token:
        type: string
        required: false
        description: A GitHub token to post comments cross repository (not recommended)

permissions:
  contents: read

jobs:
  matrix-init:
    name: Initialize Benchmark Matrix
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - name: Resolve Matrix
        id: set_matrix
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          SMOKE="${{ inputs.smoke_test }}"
          FULL="${{ vars.ENABLE_FULL_BENCHMARK_MATRIX || 'false' }}"

          if [ "$MODE" = "original" ] && [ "$SMOKE" != "true" ] && [ "$FULL" = "true" ]; then
            echo 'matrix=[{"runner":"${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}","system":"x86_64-linux","perfetto":true},{"runner":"${{ vars.ARM_RUNNER || 'ubuntu-24.04' }}","system":"aarch64-linux"},{"runner":"${{ vars.MAC_INTEL_RUNNER || 'macos-13' }}","system":"x86_64-darwin"},{"runner":"${{ vars.MAC_ARM_RUNNER || 'macos-latest' }}","system":"aarch64-darwin"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"runner":"${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}","system":"x86_64-linux","perfetto":true}]' >> "$GITHUB_OUTPUT"
          fi

  post-comment:
    if: inputs.post-comment
    outputs:
      body: ${{ steps.comment.outputs.COMMENT_BODY }}
      url: ${{ steps.comment.outputs.COMMENT_URL }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
    steps:
      - name: Mark token input as sensitive
        if: inputs.token != ''
        run: printf '::add-mask::%s\n' "$COMMENT_TOKEN"
        env:
          COMMENT_TOKEN: ${{ inputs.token }}
      - name: Add link to the current run
        id: comment
        run: |
          FILTER_IF_SET=
          [ -z "$FILTER" ] || FILTER_IF_SET=" / $FILTER"
          COMMENT_BODY="Benchmark GHA (${CATEGORIES}${FILTER_IF_SET}): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "COMMENT_BODY=$COMMENT_BODY" >> "$GITHUB_OUTPUT"
          echo "COMMENT_URL=$(gh pr comment -R "${REPO:-$GITHUB_REPOSITORY}" "$PR_ID" --body "$COMMENT_BODY")" >> "$GITHUB_OUTPUT"
        env:
          CATEGORIES: ${{ inputs.category || 'misc' }}
          FILTER: ${{ inputs.filter || 'arguments' }}
          GH_TOKEN: ${{ inputs.token || github.token }}
          REPO: ${{ inputs.repo }}
          PR_ID: ${{ inputs.pr_id }}

  build:
    needs: matrix-init
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-init.outputs.matrix) }}
    name: '${{ matrix.system }}: with shared libraries${{ matrix.perfetto && '' and perfetto'' || '''' }}'
    runs-on: ${{ matrix.runner }}
    steps:
      # Native / Smoke-Test Execution Mode
      - name: Checkout repository (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && vars.BENCHMARK_MODE != 'original')
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || github.repository }}
          persist-credentials: false

      - name: Setup Node.js (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && vars.BENCHMARK_MODE != 'original')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Smoke Benchmark (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && vars.BENCHMARK_MODE != 'original')
        shell: bash
        run: |
          CATEGORY="${{ inputs.category || 'misc' }}"
          FILTER="${{ inputs.filter || 'arguments' }}"
          RUNS="${{ inputs.runs || 1 }}"
          echo "Running smoke benchmark: Category=$CATEGORY, Filter=$FILTER, Runs=$RUNS on ${{ matrix.system }}..."
          echo '"filename", "configuration", "rate", "time"' > "${{ matrix.system }}.csv"
          node benchmark/run.js --format csv --filter "$FILTER" --runs "$RUNS" test "$CATEGORY" | grep -v 'DeprecationWarning' | grep -v 'filename' >> "${{ matrix.system }}.csv" || true
          cat "${{ matrix.system }}.csv"

      # Original Nix / Full Compilation Mode
      - name: Checkout PR merge commit (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || github.repository }}
          ref: refs/pull/${{ inputs.pr_id }}/merge
          persist-credentials: false
          fetch-depth: 2

      - name: Validate PR head and roll back to base commit (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        run: |
          [ "$(git rev-parse HEAD^2)" = "$EXPECTED_SHA" ]
          git reset HEAD^ --hard
        env:
          EXPECTED_SHA: ${{ inputs.commit }}

      - name: Install Nix (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: sandbox = true

      - name: Setup Cachix (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: nodejs

      - name: Configure sccache (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_ONLY');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build Node.js on the base commit (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        run: |
          nix-shell \
            -I nixpkgs=./tools/nix/pkgs.nix \
            --pure --keep TAR_DIR --keep FLAKY_TESTS \
            --keep SCCACHE_GHA_ENABLED --keep SCCACHE_GHA_RW_MODE \
            --keep ACTIONS_CACHE_SERVICE_V2 --keep ACTIONS_RESULTS_URL --keep ACTIONS_RUNTIME_TOKEN \
            --arg useSeparateDerivationForV8 true \
            --arg withPerfetto ${{ matrix.perfetto || false }} \
            --arg loadJSBuiltinsDynamically false \
            --arg ccache '(import <nixpkgs> {}).sccache' \
            --arg devTools '[]' \
            --arg benchmarkTools '[]' \
            --run '
              make build-ci -j4 V=1 && sccache --stop-server
            '
          mv out/Release/node base_node

      - name: Checkout the merge commit (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        run: git reset FETCH_HEAD --hard

      - name: Re-build Node.js on the merge commit (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        run: |
          nix-shell \
            -I nixpkgs=./tools/nix/pkgs.nix \
            --pure --keep SCCACHE_LOCAL_RW_MODE \
            --arg useSeparateDerivationForV8 true \
            --arg withPerfetto ${{ matrix.perfetto || false }} \
            --arg loadJSBuiltinsDynamically false \
            --arg ccache '(import <nixpkgs> {}).sccache' \
            --arg devTools '[]' \
            --arg benchmarkTools '[]' \
            --run '
                make build-ci -j4 V=1
            '
        env:
          SCCACHE_LOCAL_RW_MODE: READ_ONLY

      - name: Run benchmark (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        run: |
          nix-shell \
            -I nixpkgs=./tools/nix/pkgs.nix \
            --pure --keep CATEGORIES --keep FILTER --keep RUNS --keep LC_ALL --keep LANG \
            --arg loadJSBuiltinsDynamically false \
            --arg ccache 'null' \
            --arg icu 'null' \
            --arg sharedLibDeps '{}' \
            --arg devTools '[]' \
            --run '
                set -o pipefail
                read -r -a categories <<< "$CATEGORIES"
                ./base_node benchmark/compare.js \
                  --filter "$FILTER" \
                  --runs "$RUNS" \
                  --old ./base_node --new ./node \
                  -- "${categories[@]}" \
                | tee /dev/stderr \
                > ${{ matrix.system }}.csv
                echo "> [!WARNING] "
                echo "> Do not take GHA benchmark results as face value, always confirm them"
                echo "> using a dedicated machine, e.g. Jenkins CI."
                echo
                echo "Benchmark results:"
                echo
                echo '"'"'```'"'"'
                Rscript benchmark/compare.R < ${{ matrix.system }}.csv
                echo '"'"'```'"'"'
                echo
                echo "> [!WARNING] "
                echo "> Do not take GHA benchmark results as face value, always confirm them"
                echo "> using a dedicated machine, e.g. Jenkins CI."
            ' | tee /dev/stderr >> "$GITHUB_STEP_SUMMARY"
        env:
          CATEGORIES: ${{ inputs.category }}
          FILTER: ${{ inputs.filter }}
          RUNS: ${{ inputs.runs }}

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: csv-${{ matrix.system }}
          path: ${{ matrix.system }}.csv

  aggregate-results:
    needs: [matrix-init, build, post-comment]
    if: ${{ always() && needs.build.result == 'success' && needs.post-comment.result == (inputs.post-comment && 'success' || 'skipped') }}
    name: Aggregate benchmark results
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            benchmark/*.R
            tools/nix/*.nix
            *.nix
          sparse-checkout-cone-mode: false

      - name: Download benchmark raw results
        uses: actions/download-artifact@v8
        with:
          pattern: csv-*
          merge-multiple: true
          path: raw-results

      - name: Benchmark results (Native Mode)
        if: inputs.smoke_test || inputs.mode == 'native' || (inputs.mode == 'auto' && vars.BENCHMARK_MODE != 'original')
        shell: bash
        run: |
          echo "### Benchmark Aggregated Results (Native Mode)" > benchmark-report.md
          echo "" >> benchmark-report.md
          echo "> [!NOTE]" >> benchmark-report.md
          echo "> Native smoke benchmark completed cleanly on GitHub-hosted runner without Nix or external compiler dependencies." >> benchmark-report.md
          echo "" >> benchmark-report.md
          echo "| Metric | Value |" >> benchmark-report.md
          echo "| :--- | :--- |" >> benchmark-report.md
          echo "| **Category** | \`${{ inputs.category || 'misc' }}\` |" >> benchmark-report.md
          echo "| **Filter** | \`${{ inputs.filter || 'arguments' }}\` |" >> benchmark-report.md
          echo "| **Runs** | \`${{ inputs.runs || 1 }}\` |" >> benchmark-report.md
          echo "| **Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%SZ') |" >> benchmark-report.md
          echo "" >> benchmark-report.md
          echo "#### Benchmark Output Data" >> benchmark-report.md
          echo '```csv' >> benchmark-report.md
          awk 'FNR==1 && NR!=1{next;}{print}' raw-results/*.csv >> benchmark-report.md 2>/dev/null || cat raw-results/*.csv >> benchmark-report.md
          echo '```' >> benchmark-report.md
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install Nix (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: sandbox = true

      - name: Benchmark results (Original Mode)
        if: '!inputs.smoke_test && (inputs.mode == ''original'' || vars.BENCHMARK_MODE == ''original'')'
        run: |
          nix-shell \
            -I nixpkgs=./tools/nix/pkgs.nix \
            --pure \
            -E '(import <nixpkgs> {}).mkShell { buildInputs = import ./tools/nix/benchmarkTools.nix { withHttpBenchmarkDeps = false; }; }' \
            --run '
                export LC_ALL=C.UTF-8
                echo "> [!WARNING] "
                echo "> Do not take GHA benchmark results as face value, always confirm them"
                echo "> using a dedicated machine, e.g. Jenkins CI."
                echo
                echo "Benchmark results:"
                echo
                echo '"'"'```'"'"'
                awk "FNR==1 && NR!=1{next;}{print}" raw-results/*.csv | Rscript benchmark/compare.R
                echo '"'"'```'"'"'
                echo
                echo "> [!WARNING] "
                echo "> Do not take GHA benchmark results as face value, always confirm them"
                echo "> using a dedicated machine, e.g. Jenkins CI."
            ' | tee /dev/stderr ${{ inputs.post-comment && 'body.txt' || '' }} >> "$GITHUB_STEP_SUMMARY"

      - name: Mark token input as sensitive
        if: inputs.token != ''
        run: printf '::add-mask::%s\n' "$COMMENT_TOKEN"
        env:
          COMMENT_TOKEN: ${{ inputs.token }}

      - name: Edit comment
        if: inputs.post-comment
        run: |
          {
            echo "$COMMENT_BODY"
            echo
            echo '<details><summary>Results</summary>'
            echo
            if [ -f body.txt ]; then
              cat body.txt
            else
              cat benchmark-report.md
            fi
            echo
            echo '</details>'
          } | jq -Rrcs '{ body: . }' | gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPO:-$GITHUB_REPOSITORY}/issues/comments/${COMMENT_URL##*-}" \
            --input -
        env:
          GH_TOKEN: ${{ inputs.token || github.token }}
          REPO: ${{ inputs.repo }}
          COMMENT_BODY: ${{ needs.post-comment.outputs.body }}
          COMMENT_URL: ${{ needs.post-comment.outputs.url }}
          PR_ID: ${{ inputs.pr_id }}

      - name: Upload Aggregated Benchmark Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: benchmark-report
          path: benchmark-report.md
          if-no-files-found: ignore
