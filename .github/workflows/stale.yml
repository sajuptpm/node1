name: Close stale

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode without modifying issues or PRs
        required: false
        default: true
        type: boolean
      days_before_stale:
        description: Inactive days before marking stale
        required: false
        default: '90'
        type: string
      days_before_close:
        description: Inactive days before closing stale item
        required: false
        default: '30'
        type: string
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
  schedule:
    - cron: 0 1 * * *

# yamllint disable rule:empty-lines
env:
  CLOSE_MESSAGE: >
    This {0} has been automatically closed after 30 days of inactivity
    following its stale status (no activity for a total of 120 days).

    If this is still relevant, feel free to reopen it or leave a comment
    with additional details so we can continue the discussion.

  WARN_MESSAGE: >
    This {0} has been marked as stale due to 90 days of inactivity.

    It will be automatically closed in 30 days if no further activity occurs.
    If this is still relevant, please leave a comment or update it to keep it open.
# yamllint enable

permissions:
  contents: read

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
      actions: write
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_STALE == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Close Stale Issues and Pull Requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: ${{ inputs.days_before_stale || 90 }}
          days-before-close: ${{ inputs.days_before_close || 30 }}
          stale-issue-label: stale
          exempt-issue-labels: never-stale, confirmed-bug
          close-issue-message: ${{ format(env.CLOSE_MESSAGE, 'issue') }}
          stale-issue-message: ${{ format(env.WARN_MESSAGE, 'issue') }}
          stale-pr-label: stale
          exempt-pr-labels: never-stale
          close-pr-message: ${{ format(env.CLOSE_MESSAGE, 'pull request') }}
          stale-pr-message: ${{ format(env.WARN_MESSAGE, 'pull request') }}
          operations-per-run: ${{ github.event_name == 'workflow_dispatch' && 100 || 2500 }}
          remove-stale-when-updated: true
          debug-only: ${{ inputs.dry_run == true || (inputs.mode == 'native') || ((github.repository != 'nodejs/node' && github.repository != 'sajuptpm/node1') && inputs.dry_run != false) }}

      - name: Generate Stale Audit Report & Summary
        run: |
          mkdir -p reports
          DRY_RUN="${{ inputs.dry_run == true || (inputs.mode == 'native') || ((github.repository != 'nodejs/node' && github.repository != 'sajuptpm/node1') && inputs.dry_run != false) }}"
          STALE_DAYS="${{ inputs.days_before_stale || 90 }}"
          CLOSE_DAYS="${{ inputs.days_before_close || 30 }}"
          MODE="${{ inputs.mode || 'auto' }}"

          cat <<EOF > reports/stale-audit-report.md
          # Stale Processing Audit Report

          - **Repository**: \`${GITHUB_REPOSITORY}\`
          - **Trigger**: \`${GITHUB_EVENT_NAME}\`
          - **Mode**: \`${MODE}\`
          - **Dry Run**: \`${DRY_RUN}\`
          - **Days Before Stale**: \`${STALE_DAYS}\`
          - **Days Before Close**: \`${CLOSE_DAYS}\`
          - **Issue Exemptions**: \`never-stale\`, \`confirmed-bug\`
          - **PR Exemptions**: \`never-stale\`
          - **Status**: Audit and stale processing completed successfully.
          EOF

          echo "## Stale Processing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/stale-audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stale Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stale-audit-report
          path: reports/stale-audit-report.md
          if-no-files-found: ignore
