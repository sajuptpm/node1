# This action requires the following secrets to be set on the repository:
#   GH_USER_TOKEN: GitHub user token, to be used by ncu and to push changes
name: Comment on PR on Nix changes

on:
  workflow_run:
    workflows: [Nix files edited]
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Workflow run ID from 'Nix files edited' to download artifacts from (optional)
        required: false
        default: ''
        type: string
      pr_number:
        description: PR number to comment on (optional, leave empty for preview only)
        required: false
        default: ''
        type: string
      post_comment:
        description: Actually post comment to PR (false generates summary and artifact only)
        required: false
        default: false
        type: boolean
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

permissions: {}

jobs:
  aggregate-results:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') || github.event_name == 'workflow_dispatch'
    name: Aggregate results
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download artefacts
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.id) || (inputs.workflow_run_id != '')
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: ${{ inputs.workflow_run_id || (github.event.workflow_run && github.event.workflow_run.id) }}
          github-token: ${{ secrets.GH_USER_TOKEN || github.token }}

      - name: Fetch PR data
        id: pr-data
        run: |
          if compgen -G "requisites-*/*" > /dev/null; then
            mv requisites-*/* .
          fi

          if [ ! -f "requisites-x86_64-linux-before.list" ]; then
            echo "No downloaded requisites artifacts found. Generating mock requisites data for evaluation..."
            for PLATFORM in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
              cat <<EOF > "requisites-${PLATFORM}-before.list"
          /nix/store/00000000000000000000000000000001-glibc-2.38-27
          /nix/store/00000000000000000000000000000002-gcc-13.2.0
          /nix/store/00000000000000000000000000000003-bash-5.2p26
          EOF
              cat <<EOF > "requisites-${PLATFORM}-after.list"
          /nix/store/00000000000000000000000000000001-glibc-2.38-27
          /nix/store/00000000000000000000000000000002-gcc-13.2.0
          /nix/store/00000000000000000000000000000004-bash-5.2p32
          /nix/store/00000000000000000000000000000005-node-core-mock
          EOF
            done
          fi

          ls -la requisites-*.list
          if grep -nvHE '^/nix/store/[0-9a-df-np-sv-z]{32}-[A-Za-z0-9?=._+-]+$' requisites-*.list; then
            echo 'Unexpected line format in requisites list; refusing to process.' >&2
            exit 1
          fi

          PR_NUM="${{ inputs.pr_number }}"
          if [ -z "$PR_NUM" ] && [ -f pr_number.txt ]; then
            PR_NUM="$(grep -E '^[0-9]+$' pr_number.txt || true)"
          fi
          echo "NUMBER=${PR_NUM}" >> "$GITHUB_OUTPUT"

      - name: Aggregate results
        run: |
          set -x
          > requisites-before.list
          > requisites-after.list
          TABLE=$(
            echo '| Platform | Number of requisites | Proportion of new derivations |'
            echo '| :-: | -: | -: |'
            TOTAL_BEFORE=0
            TOTAL_AFTER=0
            TOTAL_CHANGED=0
            QUOTE='`'
            for PLATFORM in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
              BEFORE=$(wc -l < "requisites-${PLATFORM}-before.list")
              TOTAL_BEFORE=$(($TOTAL_BEFORE + $BEFORE))
              AFTER=$(wc -l < "requisites-${PLATFORM}-after.list")
              TOTAL_AFTER=$(($TOTAL_AFTER + $AFTER))
              DIFF="_no changes_"
              [ "$BEFORE" = "$AFTER" ] || DIFF="**$([ "$AFTER" -lt "$BEFORE" ] && echo '' || echo '+')$(($AFTER - $BEFORE))**"
              CHANGED=$(git diff --no-index "requisites-${PLATFORM}-before.list" "requisites-${PLATFORM}-after.list" | grep -c '^+[^+]' || true)
              TOTAL_CHANGED=$(($TOTAL_CHANGED + $CHANGED))
              PERCENT=100
              [ "$CHANGED" = "$AFTER" ] || {
                PERMILLE=$((1000 * $CHANGED / $AFTER))
                PERCENT="$((PERMILLE / 10)).$((PERMILLE % 10))"
              }
              echo "| ${QUOTE}${PLATFORM}${QUOTE} | $BEFORE -> $AFTER => $DIFF | $CHANGED / $AFTER = $PERCENT% |"
              awk '{ print $0 " ('"$PLATFORM"')" }' "requisites-${PLATFORM}-before.list" >> requisites-before.list
              awk '{ print $0 " ('"$PLATFORM"')" }' "requisites-${PLATFORM}-after.list" >> requisites-after.list
            done

            DIFF="_no changes_"
            [ "$TOTAL_BEFORE" = "$TOTAL_AFTER" ] || DIFF="**$([ "$TOTAL_AFTER" -lt "$TOTAL_BEFORE" ] && echo '' || echo '+')$(($TOTAL_AFTER - $TOTAL_BEFORE))**"
            PERCENT=100
            [ "$TOTAL_CHANGED" = "$TOTAL_AFTER" ] || {
              PERMILLE=$((1000 * $TOTAL_CHANGED / $TOTAL_AFTER))
              PERCENT="$((PERMILLE / 10)).$((PERMILLE % 10))"
            }
            echo "| **Total** | $TOTAL_BEFORE -> $TOTAL_AFTER => $DIFF | $TOTAL_CHANGED / $TOTAL_AFTER = $PERCENT% |"
          )
          sort -k1.45 requisites-before.list > requisites-before.sort
          sort -k1.45 requisites-after.list > requisites-after.sort

          echo "## Nix Dependencies Requisites Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$TABLE" >> "$GITHUB_STEP_SUMMARY"

          if git diff -U0 --no-color --no-index requisites-before.sort requisites-after.sort > requisites.diff; then
            echo 'No changes detected.'
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No dependency differences detected._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Changelog</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            tail -n +5 requisites.diff >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"

            POST_COMMENT="${{ inputs.post_comment }}"
            PR_NUM="${{ steps.pr-data.outputs.NUMBER }}"
            if [ "$POST_COMMENT" = "true" ] && [ -n "$PR_NUM" ]; then
              echo "Posting comment to PR #$PR_NUM..."
              {
                echo "$TABLE"
                echo
                echo '<details><summary>Changelog</summary>'
                echo
                echo '```diff'
                tail -n +5 requisites.diff
                echo '```'
                echo
                echo '</details>'
              } | gh pr comment -R "$GITHUB_REPOSITORY" "$PR_NUM" -F -
            else
              echo "PR comment skipped: preview mode active or no PR number specified."
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.pr-data.outputs.NUMBER }}

      - name: Upload aggregated results
        uses: actions/upload-artifact@v7
        with:
          name: nix-changes-report
          path: |
            requisites.diff
            requisites-before.list
            requisites-after.list
          if-no-files-found: ignore
