name: Find inactive collaborators

on:
  schedule:
    # Run every Monday at 4:05 AM UTC.
    - cron: 5 4 * * 1
  workflow_dispatch:
    inputs:
      since:
        description: Time window for inactivity check (e.g. 12 months ago, 6 months ago)

        required: false
        default: 12 months ago

        type: string
      create_pr:
        description: Open a pull request with updated README.md if inactive collaborators found

        required: false
        default: false
        type: boolean
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

env:
  NODE_VERSION: lts/*

permissions:
  contents: write
  pull-requests: write

jobs:
  find:
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_INACTIVE_COLLABORATORS == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve Execution Mode & Parameters
        id: resolve-config
        run: |
          SINCE_INPUT="${{ inputs.since || '12 months ago' }}"
          CREATE_PR_INPUT="${{ inputs.create_pr || 'false' }}"
          INPUT_MODE="${{ inputs.mode || 'auto' }}"

          if [ "$INPUT_MODE" = "auto" ]; then
            if { [ "${{ github.repository }}" = "nodejs/node" ] || [ "${{ github.repository }}" = "sajuptpm/node1" ]; } && [ -n "${{ secrets.GH_USER_TOKEN }}" ]; then
              RESOLVED_MODE="original"
              RESOLVED_CREATE_PR="true"
            else
              RESOLVED_MODE="native"
              RESOLVED_CREATE_PR="$CREATE_PR_INPUT"
            fi
          elif [ "$INPUT_MODE" = "original" ]; then
            RESOLVED_MODE="original"
            RESOLVED_CREATE_PR="true"
          else
            RESOLVED_MODE="native"
            RESOLVED_CREATE_PR="$CREATE_PR_INPUT"
          fi

          echo "mode=$RESOLVED_MODE" >> $GITHUB_OUTPUT
          echo "create_pr=$RESOLVED_CREATE_PR" >> $GITHUB_OUTPUT
          echo "since=$SINCE_INPUT" >> $GITHUB_OUTPUT
          echo "Resolved Mode: $RESOLVED_MODE, Create PR: $RESOLVED_CREATE_PR, Since: $SINCE_INPUT"
      - name: Find inactive collaborators
        run: |
          node tools/find-inactive-collaborators.mjs --verbose "${{ steps.resolve-config.outputs.since }}"
      - name: Generate Summary Report
        if: always()
        run: |
          mkdir -p audit-reports
          git diff README.md > audit-reports/readme-collaborators.diff || true
          python3 -c '
          import os, subprocess

          mode = os.environ.get("MODE", "unknown")
          create_pr = os.environ.get("CREATE_PR", "false")
          since = os.environ.get("SINCE", "12 months ago")
          repo = os.environ.get("REPO", "unknown")
          event = os.environ.get("EVENT", "unknown")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          readme_changed = False
          diff_stat = ""
          try:
              status = subprocess.check_output(["git", "status", "--porcelain", "README.md"], text=True).strip()
              readme_changed = len(status) > 0
              if readme_changed:
                  diff_stat = subprocess.check_output(["git", "diff", "--stat", "README.md"], text=True).strip()
          except Exception as e:
              diff_stat = str(e)

          report = f"""# Inactive Collaborators Audit Summary

          | Parameter | Value |
          | :--- | :--- |
          | **Repository** | `{repo}` |
          | **Event** | `{event}` |
          | **Execution Mode** | `{mode}` |
          | **Inactivity Window** | `{since}` |
          | **Create PR Enabled** | `{create_pr}` |
          | **README Modifications** | `{"Yes (Inactive collaborators identified)" if readme_changed else "None (All collaborators active)"}` |

          ## Audit Findings
          {f"```\n{diff_stat}\n```" if readme_changed else "No inactive collaborators detected in specified window."}

          ## Execution Details
          - **Mode Description**: {"GitHub-Native safe audit without unsolicited PR creation" if mode == "native" else "Original automated PR creation"}
          - **Status**: Audit completed successfully.
          """

          with open("audit-reports/inactive-collaborators-summary.md", "w", encoding="utf-8") as f:
              f.write(report)

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(report)
          '
        env:
          MODE: ${{ steps.resolve-config.outputs.mode }}
          CREATE_PR: ${{ steps.resolve-config.outputs.create_pr }}
          SINCE: ${{ steps.resolve-config.outputs.since }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
      - name: Upload Inactive Collaborators Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inactive-collaborators-report
          path: audit-reports/
          retention-days: 7
      - name: Open pull request (Original Mode / Requested)
        if: steps.resolve-config.outputs.create_pr == 'true'
        uses: gr2m/create-or-update-pull-request-action@b65137ca591da0b9f43bad7b24df13050ea45d1b  # v1.10.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_USER_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          author: Node.js GitHub Bot <github-bot@iojs.org>
          branch: actions/inactive-collaborators
          body: |
            This PR was generated by the [`find-inactive-collaborators.yml` workflow](https://github.com/nodejs/node/blob/main/.github/workflows/find-inactive-collaborators.yml).

            @nodejs/tsc Please follow up with the [offboarding tasks](https://github.com/nodejs/node/blob/main/doc/contributing/offboarding.md).
          commit-message: 'meta: move one or more collaborators to emeritus'
          labels: meta
          title: 'meta: move one or more collaborators to emeritus'
