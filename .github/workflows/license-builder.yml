name: License update

on:
  schedule:
    # 00:00:00 every Monday
    - cron: 0 0 * * 1
  workflow_dispatch:
    inputs:
      create_pr:
        description: Open a pull request with updated LICENSE if changes detected

        required: false
        default: false
        type: boolean
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

permissions:
  contents: read

jobs:
  update_license:
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_LICENSE_UPDATE == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Configuration & Inputs
        id: resolve-config
        run: |
          CREATE_PR_INPUT="${{ inputs.create_pr || 'false' }}"
          INPUT_MODE="${{ inputs.mode || 'auto' }}"

          if [ "$INPUT_MODE" = "auto" ]; then
            if { [ "${{ github.repository }}" = "nodejs/node" ] || [ "${{ github.repository }}" = "sajuptpm/node1" ]; } && [ "${{ github.event_name }}" = "schedule" ]; then
              RESOLVED_MODE="original"
              RESOLVED_CREATE_PR="true"
            else
              RESOLVED_MODE="native"
              RESOLVED_CREATE_PR="$CREATE_PR_INPUT"
            fi
          elif [ "$INPUT_MODE" = "original" ]; then
            RESOLVED_MODE="original"
            RESOLVED_CREATE_PR="true"
          else
            RESOLVED_MODE="native"
            RESOLVED_CREATE_PR="$CREATE_PR_INPUT"
          fi

          echo "mode=$RESOLVED_MODE" >> $GITHUB_OUTPUT
          echo "create_pr=$RESOLVED_CREATE_PR" >> $GITHUB_OUTPUT
          echo "Resolved Mode: $RESOLVED_MODE, Create PR: $RESOLVED_CREATE_PR"

      - name: Build License
        run: ./tools/license-builder.sh

      - name: Generate Summary Report
        if: always()
        run: |
          mkdir -p license-reports
          git diff LICENSE > license-reports/license.diff || true
          python3 -c '
          import os, subprocess

          mode = os.environ.get("MODE", "unknown")
          create_pr = os.environ.get("CREATE_PR", "false")
          repo = os.environ.get("REPO", "unknown")
          event = os.environ.get("EVENT", "unknown")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          license_changed = False
          diff_stat = ""
          try:
              status = subprocess.check_output(["git", "status", "--porcelain", "LICENSE"], text=True).strip()
              license_changed = len(status) > 0
              if license_changed:
                  diff_stat = subprocess.check_output(["git", "diff", "--stat", "LICENSE"], text=True).strip()
          except Exception as e:
              diff_stat = str(e)

          report = f"""# License Builder Execution Summary

          | Parameter | Value |
          | :--- | :--- |
          | **Repository** | `{repo}` |
          | **Event** | `{event}` |
          | **Execution Mode** | `{mode}` |
          | **Create PR Enabled** | `{create_pr}` |
          | **License Modified** | `{"Yes (Updates detected)" if license_changed else "None (Up to date)"}` |

          ## Audit Findings
          {f"```\n{diff_stat}\n```" if license_changed else "LICENSE file is completely up to date with all bundled dependencies."}

          ## Execution Details
          - **Mode Description**: {"GitHub-Native safe license rebuild & diff verification" if mode == "native" else "Original license build and PR creation"}
          - **Status**: Completed successfully.
          """

          with open("license-reports/license-builder-summary.md", "w", encoding="utf-8") as f:
              f.write(report)

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(report)
          '
        env:
          MODE: ${{ steps.resolve-config.outputs.mode }}
          CREATE_PR: ${{ steps.resolve-config.outputs.create_pr }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}

      - name: Upload License Builder Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-builder-report
          path: license-reports/
          retention-days: 7

      - name: Open pull request (Original Mode / Requested)
        if: steps.resolve-config.outputs.create_pr == 'true'
        uses: gr2m/create-or-update-pull-request-action@b65137ca591da0b9f43bad7b24df13050ea45d1b  # v1.10.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          author: Node.js GitHub Bot <github-bot@iojs.org>
          branch: actions/license-builder
          title: 'doc: run license-builder'
          body: >
            License is likely out of date. This is an automatically generated PR by
            the `license-builder.yml` GitHub Action, which runs `license-builder.sh`
            and submits a new PR or updates an existing PR.
          commit-message: 'doc: run license-builder'
          labels: meta
