name: Unlabel not-ready pull requests

on:
  schedule:
    - cron: 15 3 * * *
  workflow_dispatch:
    inputs:
      pr_number:
        description: Specific PR number to check (leave empty to scan all open PRs with author ready label)

        required: false
        default: ''
      mode:
        description: 'Execution mode: auto (default), native (audit summary/artifact), original (live unlabel & comment)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      dry_run:
        description: Audit conflicting PRs without modifying labels or posting comments

        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  remove-label:
    name: Remove author ready
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_UNLABEL_CONFLICTS == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Resolve Execution Mode
        id: mode-resolver
        env:
          INPUT_MODE: ${{ inputs.mode || vars.WORKFLOW_MODE || 'auto' }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$INPUT_MODE" = "original" ] && [ "$IS_DRY_RUN" = "false" ]; then
            RESOLVED="original"
          else
            RESOLVED="native"
          fi
          echo "mode=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Scan and Process Conflicting PRs
        env:
          GH_TOKEN: ${{ secrets.GH_USER_TOKEN || github.token }}
          TARGET_PR: ${{ inputs.pr_number }}
          RUN_MODE: ${{ steps.mode-resolver.outputs.mode }}
          IS_DRY_RUN: ${{ inputs.dry_run != false }}
          MESSAGE: >-
            This pull request has conflicts with its base branch, removing the
            `author ready` label.

            Please
            [rebase](https://github.com/nodejs/node/blob/HEAD/doc/contributing/pull-requests.md#step-5-rebase)
            your branch onto the latest base branch, resolve the conflicts
            locally, and force-push.

            Afterwards the pull request needs a fresh collaborator approval,
            and a collaborator will add the label back once it is
            [author ready](https://github.com/nodejs/node/blob/HEAD/doc/contributing/collaborator-guide.md#author-ready-pull-requests)
            again.
        run: |
          mkdir -p out/conflicts
          AUDIT_FILE="out/conflicts/audit-report.md"

          echo "### Conflicting PRs Unlabel Audit" > "$AUDIT_FILE"
          echo "- **Execution Mode**: $RUN_MODE" >> "$AUDIT_FILE"
          echo "- **Dry Run**: $IS_DRY_RUN" >> "$AUDIT_FILE"
          echo "" >> "$AUDIT_FILE"
          echo "| PR Number | State | Mergeable | Action Taken |" >> "$AUDIT_FILE"
          echo "| :--- | :--- | :--- | :--- |" >> "$AUDIT_FILE"

          COUNT=0
          if [ -n "$TARGET_PR" ]; then
            echo "Checking specified PR #$TARGET_PR..."
            PR_JSON=$(gh pr view "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --json number,state,mergeable 2>/dev/null || echo "{}")
            NUM=$(echo "$PR_JSON" | jq -r '.number // empty')
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable // empty')
            STATE=$(echo "$PR_JSON" | jq -r '.state // empty')

            if [ -n "$NUM" ]; then
              COUNT=$((COUNT + 1))
              if [ "$MERGEABLE" = "CONFLICTING" ]; then
                if [ "$RUN_MODE" = "original" ] && [ "$IS_DRY_RUN" = "false" ]; then
                  gh pr edit "$NUM" --repo "$GITHUB_REPOSITORY" --remove-label 'author ready' || true
                  printf '%s\n' "$MESSAGE" | gh pr comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file - || true
                  ACTION="Unlabeled and Commented"
                else
                  ACTION="Simulated Unlabel & Comment (Dry-Run)"
                fi
              else
                ACTION="No action (Mergeable: $MERGEABLE)"
              fi
              echo "| #$NUM | $STATE | $MERGEABLE | $ACTION |" >> "$AUDIT_FILE"
            fi
          else
            echo "Scanning open PRs labeled 'author ready'..."
            PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'author ready' --state open --limit 100 --json number,mergeable,state 2>/dev/null || echo "[]")

            echo "$PRS" | jq -c '.[]' | while read -r pr; do
              NUM=$(echo "$pr" | jq -r '.number')
              MERGEABLE=$(echo "$pr" | jq -r '.mergeable')
              STATE=$(echo "$pr" | jq -r '.state')

              if [ "$MERGEABLE" = "CONFLICTING" ]; then
                if [ "$RUN_MODE" = "original" ] && [ "$IS_DRY_RUN" = "false" ]; then
                  gh pr edit "$NUM" --repo "$GITHUB_REPOSITORY" --remove-label 'author ready' || true
                  printf '%s\n' "$MESSAGE" | gh pr comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file - || true
                  ACTION="Unlabeled and Commented"
                else
                  ACTION="Simulated Unlabel & Comment (Dry-Run)"
                fi
              else
                ACTION="Retained (Mergeable: $MERGEABLE)"
              fi
              echo "| #$NUM | $STATE | $MERGEABLE | $ACTION |" >> "$AUDIT_FILE"
            done
          fi

          if [ "$COUNT" -eq 0 ] && [ -z "$TARGET_PR" ]; then
            PR_COUNT=$(echo "$PRS" | jq '. | length' 2>/dev/null || echo 0)
            if [ "$PR_COUNT" -eq 0 ]; then
              echo "| None | - | - | No open PRs currently have the 'author ready' label |" >> "$AUDIT_FILE"
            fi
          fi

          cat "$AUDIT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Conflicts Audit Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: conflicts-audit-report
          path: out/conflicts/*
          if-no-files-found: ignore
