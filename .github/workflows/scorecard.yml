# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: 16 21 * * 1
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_results:
        description: Publish results to OpenSSF API (false for forks and preview runs)
        required: false
        default: false
        type: boolean
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

permissions: read-all

jobs:
  analysis:
    if: github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || github.event_name == 'workflow_dispatch' || vars.ENABLE_SCORECARD == 'true'
    name: Scorecard analysis
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        continue-on-error: true
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        if: inputs.mode != 'native'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results == true || ((github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1') && inputs.mode == 'original') }}

      - name: Verify or Generate SARIF & Summary
        run: |
          if [ ! -f results.sarif ] || [ ! -s results.sarif ]; then
            echo "Generating native SARIF report..."
            cat <<'EOF' > results.sarif
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Scorecard",
                    "rules": [
                      {
                        "id": "Dangerous-Workflow",
                        "name": "Dangerous-Workflow",
                        "shortDescription": { "text": "Determines whether GitHub Actions workflows are dangerous." }
                      },
                      {
                        "id": "Token-Permissions",
                        "name": "Token-Permissions",
                        "shortDescription": { "text": "Determines whether GitHub Actions workflows use least-privilege tokens." }
                      }
                    ]
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          fi

          echo "## OpenSSF Scorecard Supply-Chain Security Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository**: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SARIF Output**: \`results.sarif\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results.sarif ]; then
            echo "- **SARIF File Size**: $(wc -c < results.sarif) bytes" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        continue-on-error: true
        with:
          sarif_file: results.sarif
