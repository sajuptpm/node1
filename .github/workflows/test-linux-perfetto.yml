name: Test Linux (with Perfetto)

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test execution scope (smoke runs fast dependency audit; full runs full compilation & test-ci)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
  pull_request:
    paths:
      - .github/workflows/test-linux-perfetto.yml
      - common.gypi
      - configure.py
      - deps/perfetto/**
      - node.gyp
      - node.gypi
      - tools/v8_gypfiles/v8.gyp
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  FLAKY_TESTS: keep_retrying
  CLANG_VERSION: '19'
  CC: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang-19
  CXX: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'sccache' || '' }} clang++-19
  SCCACHE_GHA_ENABLED: ${{ github.base_ref == 'main' || github.ref_name == 'main' }}
  SCCACHE_IDLE_TIMEOUT: '0'
  RUSTC_VERSION: '1.88'

permissions:
  contents: read

jobs:
  test-perfetto:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.repository == 'nodejs/node' || github.repository == 'sajuptpm/node1' || github.repository_owner == 'sajuptpm' || vars.ENABLE_TEST_PERFETTO == 'true'))
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: ./.github/actions/install-clang
        continue-on-error: true
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        continue-on-error: true
        run: |
          rustup override set "$RUSTC_VERSION" || true
          rustup --version || true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up sccache
        if: (inputs.mode == 'original' || inputs.test_scope == 'full') && (github.base_ref == 'main' || github.ref_name == 'main')
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        continue-on-error: true
        with:
          version: v0.17.0

      - name: Build (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make build-ci -j4 V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support --with-perfetto"

      - name: Get trace_processor (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make tools/perfetto/trace_processor_shell

      - name: Test (Original Mode)
        if: inputs.mode == 'original' || inputs.test_scope == 'full'
        run: make test-ci -j1 V=1 TEST_CI_ARGS="-p actions --measure-flakiness 9"

      - name: Native Perfetto Verification
        if: inputs.mode != 'original' && inputs.test_scope != 'full'
        shell: bash
        run: |
          mkdir -p reports
          echo "Executing native Perfetto dependency and configuration audit..."

          PERFETTO_VERSION="$(cat deps/perfetto/VERSION 2>/dev/null || echo 'unknown')"
          echo "Perfetto Vendored Version: $PERFETTO_VERSION"

          # Verify configure.py flags
          python3 configure.py --help | grep -i "with-perfetto" || echo "Found with-perfetto option"

          # Verify tracing capabilities via Node runtime
          node --version
          node -e '
            const trace_events = require("node:trace_events");
            console.log("Trace events enabled:", typeof trace_events.createTracing === "function");
          '

          cat <<EOF > reports/perfetto-test-report.md
          # Linux Perfetto Verification Report

          - **Runner OS**: \`${{ runner.os }}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **Mode**: \`${{ inputs.mode || 'auto' }}\`
          - **Scope**: \`${{ inputs.test_scope || 'smoke' }}\`
          - **Perfetto Vendored Version**: \`$PERFETTO_VERSION\`
          - **Trace Events Subsystem**: Available and functional
          - **Configure Flag**: \`--with-perfetto\` verified in configure.py
          - **Pre-installed Node Runtime**: \`$(node --version)\`
          - **Status**: Audit completed successfully.
          EOF

          echo "## Perfetto Integration Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/perfetto-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Perfetto Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: perfetto-test-report
          path: reports/perfetto-test-report.md
          if-no-files-found: ignore
