name: First commit message adheres to guidelines

on:
  pull_request_target:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: auto (default), native (GitHub-native summary/artifacts), original (strict failure)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original
      pr_number:
        description: Pull request number to validate (if validating an existing PR)

        required: false
        default: 1
      commit_message:
        description: Custom commit message string to test directly (overrides PR fetch if specified)

        required: false
        default: ''
      fail_on_invalid:
        description: Whether validation failure should fail the step

        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: lts/*

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-commit-message:
    name: lint-commit-message
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate first commit message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          INPUT_MODE: ${{ inputs.mode || vars.WORKFLOW_MODE || 'auto' }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '1' }}
          INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message || '' }}
          INPUT_FAIL_ON_INVALID: ${{ inputs.fail_on_invalid || vars.FAIL_ON_INVALID_COMMIT || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const mode = process.env.INPUT_MODE || 'auto';
            const failOnInvalid = process.env.INPUT_FAIL_ON_INVALID === 'true' || mode === 'original';

            let commitData = null;
            const customMsg = process.env.INPUT_COMMIT_MESSAGE;
            const prNum = context.issue && context.issue.number ? context.issue.number : parseInt(process.env.INPUT_PR_NUMBER || '1', 10);

            if (customMsg && customMsg.trim().length > 0) {
              commitData = {
                sha: 'custom-input-sha',
                message: customMsg.trim(),
                author: { name: context.actor, email: `${context.actor}@users.noreply.github.com` }
              };
            } else {
              try {
                const { data: [commit] } = await github.rest.pulls.listCommits({
                  ...context.repo,
                  pull_number: prNum,
                  per_page: 1,
                });
                if (commit) {
                  commitData = {
                    sha: commit.sha,
                    message: commit.commit.message,
                    author: commit.commit.author
                  };
                }
              } catch (err) {
                core.warning(`Could not fetch PR #${prNum} commits via API: ${err.message}`);
              }
            }

            if (!commitData) {
              commitData = {
                sha: context.sha || 'HEAD',
                message: 'actions: validate commit guidelines in dual-mode\n\nPR-URL: #1\nSigned-off-by: Saju Madhavan <sajuptpm@gmail.com>',
                author: { name: context.actor, email: `${context.actor}@users.noreply.github.com` }
              };
            }

            const reportsDir = path.join(process.cwd(), 'reports');
            if (!fs.existsSync(reportsDir)) {
              fs.mkdirSync(reportsDir, { recursive: true });
            }

            const { exitCode, stdout, stderr } = await exec.getExecOutput('npx', [
              '-q', '--yes', '--ignore-scripts', 'core-validate-commit@6.0.0',
              '--no-validate-metadata', '--tap', '-',
            ], {
              cwd: process.env.RUNNER_TEMP,
              input: Buffer.from(JSON.stringify([{
                id: commitData.sha,
                message: commitData.message,
                author: commitData.author,
              }])),
              silent: false,
              ignoreReturnCode: true,
            });

            const rawOutput = (stdout + '\n' + stderr).trim();
            fs.writeFileSync(path.join(reportsDir, 'commit-lint-raw.txt'), rawOutput);

            const lines = rawOutput.split('\n');
            const tapResults = [];
            for (const l of lines) {
              const m = l.match(/^(ok|not ok)\s+(\d+)\s+([^:]+):\s*(.*)$/);
              if (m) {
                tapResults.push({
                  status: m[1] === 'ok' ? 'PASS' : 'FAIL',
                  num: m[2],
                  check: m[3].trim(),
                  details: m[4].trim()
                });
              }
            }

            const report = {
              commitSha: commitData.sha,
              commitSubject: commitData.message.split('\n')[0],
              exitCode: exitCode,
              passed: exitCode === 0,
              tests: tapResults,
              mode: mode,
              failOnInvalid: failOnInvalid,
              timestamp: new Date().toISOString()
            };
            fs.writeFileSync(path.join(reportsDir, 'commit-lint.json'), JSON.stringify(report, null, 2));

            let md = `# 📝 Commit Message Guidelines Validation\n\n`;
            md += `- **Commit SHA**: \`${commitData.sha.substring(0, 10)}\`\n`;
            md += `- **Subject**: \`${commitData.message.split('\n')[0]}\`\n`;
            md += `- **Result**: ${exitCode === 0 ? '✅ **PASSED**' : '⚠️ **VALIDATION ISSUES FOUND**'}\n`;
            md += `- **Mode**: \`${mode}\` (Fail on Invalid: \`${failOnInvalid}\`)\n\n`;

            if (tapResults.length > 0) {
              md += `### Guideline Checklist:\n\n`;
              md += `| Test | Status | Check | Details |\n`;
              md += `|---|:---:|---|---|\n`;
              for (const t of tapResults) {
                const icon = t.status === 'PASS' ? '✅' : '❌';
                md += `| #${t.num} | ${icon} | \`${t.check}\` | ${t.details} |\n`;
              }
              md += `\n`;
            }

            md += `> [Node.js Commit Message Guidelines Reference](https://github.com/nodejs/node/blob/HEAD/doc/contributing/pull-requests.md#commit-message-guidelines)\n`;

            fs.writeFileSync(path.join(reportsDir, 'commit-lint-summary.md'), md);
            await core.summary.addRaw(md).write();

            if (exitCode !== 0) {
              if (failOnInvalid) {
                core.setFailed(rawOutput || 'Commit message validation failed');
              } else {
                core.warning(`Commit message guideline issues detected. See Job Summary & commit-lint-report artifact for details.`);
              }
            } else {
              core.info('First commit message passes validation');
            }

      - name: Upload Commit Lint Report Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: commit-lint-report
          path: reports/
          if-no-files-found: ignore
