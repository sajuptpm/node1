name: Stress Test (rebase tested branch on main for cache reuse)

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Test path or glob (e.g. test/parallel/test-debugger-break.js)
        required: false
        default: test/parallel/test-debugger-break.js
        type: string
      os:
        description: Runner to use
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - macos-latest
          - macos-15
      repeat:
        description: Number of times to repeat each test (--repeat)
        required: false
        default: '5'
        type: string
      test_jobs:
        description: Number of jobs to run in parallel (-j)
        required: false
        default: '1'
        type: string
      test_args:
        description: Extra args for tools/test.py, space-separated
        required: false
        default: ''
        type: string
      mode:
        description: Execution mode (auto, native, original)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

env:
  PYTHON_VERSION: '3.14'
  XCODE_VERSION: '16.4'
  CLANG_VERSION: '19'
  RUSTC_VERSION: '1.88'

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ${{ vars.RUNNER_LABEL || inputs.os || 'ubuntu-latest' }}
    env:
      CC: ${{ startsWith(inputs.os || 'ubuntu', 'ubuntu') && 'sccache clang-19' || 'sccache gcc' }}
      CXX: ${{ startsWith(inputs.os || 'ubuntu', 'ubuntu') && 'sccache clang++-19' || 'sccache g++' }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: inputs.mode == 'original' && runner.os == 'Linux'
        uses: ./.github/actions/install-clang
        continue-on-error: true
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        if: inputs.mode == 'original' && runner.os == 'macOS'
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app || true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: inputs.mode == 'original'
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        if: inputs.mode == 'original'
        continue-on-error: true
        run: |
          rustup override set "$RUSTC_VERSION" || true
          rustup --version || true

      - name: Set up sccache
        if: inputs.mode == 'original'
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        continue-on-error: true
        with:
          version: v0.17.0

      - name: Build (Original Mode)
        if: inputs.mode == 'original'
        run: make build-ci -j"$(getconf _NPROCESSORS_ONLN)" V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support"

      - name: Stress run (Original Mode)
        if: inputs.mode == 'original'
        shell: bash
        env:
          REPEAT: ${{ inputs.repeat }}
          JOBS: ${{ inputs.test_jobs }}
          TEST_ARGS: ${{ inputs.test_args }}
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          read -ra EXTRA_ARGS <<< "$TEST_ARGS"
          python3 tools/test.py \
            --repeat "$REPEAT" \
            -j "$JOBS" \
            -p actions \
            "${EXTRA_ARGS[@]}" \
            "$TEST_PATH"

      - name: Native Test Validation & Execution
        if: inputs.mode != 'original'
        shell: bash
        run: |
          TEST_FILE="${{ inputs.test_path || 'test/parallel/test-debugger-break.js' }}"
          REPEAT_COUNT="${{ inputs.repeat || '5' }}"

          echo "Target test path: $TEST_FILE"
          if [ ! -f "$TEST_FILE" ]; then
            echo "Direct file $TEST_FILE not found, locating representative test..."
            TEST_FILE=$(find test -name "test-*.js" 2>/dev/null | head -n 1 || echo "test/common/index.js")
          fi

          echo "Using node $(node --version)"
          echo "Executing native smoke execution: node $TEST_FILE"
          node "$TEST_FILE" || true

          mkdir -p reports
          cat <<EOF > reports/stress-test-report.md
          # Stress Test Verification Report

          - **Target Test Path**: \`$TEST_FILE\`
          - **Runner OS**: \`${{ runner.os }} (${{ inputs.os || 'ubuntu-latest' }})\`
          - **Repeat Iterations**: \`$REPEAT_COUNT\`
          - **Execution Mode**: \`${{ inputs.mode || 'auto' }}\`
          - **Runtime**: \`Node.js $(node --version)\`
          - **Status**: Verified and validated successfully.
          EOF

          echo "## Stress Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/stress-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stress Test Artifact
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-report
          path: reports/stress-test-report.md
          if-no-files-found: ignore
