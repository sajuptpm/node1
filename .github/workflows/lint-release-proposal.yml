name: Linters (release proposals)

on:
  push:
    branches:
      - v[0-9]+.[0-9]+.[0-9]+-proposal
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Testing scope (smoke: validate release lint toolchains & rules; full: execute live proposal branch linter)'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      mode:
        description: Execution mode (auto, native, original)

        required: false
        default: auto
        type: choice
        options:
          - auto
          - native
          - original

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  lint-release-commit:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve Execution Mode & Scope
        id: resolve-config
        run: |
          SCOPE="${{ inputs.test_scope || 'smoke' }}"
          INPUT_MODE="${{ inputs.mode || 'auto' }}"

          if [ "$INPUT_MODE" = "auto" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              RESOLVED_MODE="original"
              RESOLVED_SCOPE="full"
            else
              RESOLVED_MODE="native"
              RESOLVED_SCOPE="$SCOPE"
            fi
          elif [ "$INPUT_MODE" = "original" ]; then
            RESOLVED_MODE="original"
            RESOLVED_SCOPE="${{ inputs.test_scope || 'full' }}"
          else
            RESOLVED_MODE="native"
            RESOLVED_SCOPE="$SCOPE"
          fi

          echo "mode=$RESOLVED_MODE" >> $GITHUB_OUTPUT
          echo "scope=$RESOLVED_SCOPE" >> $GITHUB_OUTPUT
          echo "Resolved Mode: $RESOLVED_MODE, Scope: $RESOLVED_SCOPE"
      - name: Lint release commit title format
        id: commit-message-parse
        run: |
          VERSION=$(${CXX:-cc} -E -dM src/node_version.h | awk '
            $2 == "NODE_MAJOR_VERSION"  { maj = $3 }
            $2 == "NODE_MINOR_VERSION"  { min = $3 }
            $2 == "NODE_PATCH_VERSION"  { pat = $3 }
            $2 == "NODE_VERSION_LTS_CODENAME" { gsub(/^"|"$/, "'"'"'",$3); lts = $3 }
            END { if (maj) print maj "\\." min "\\." pat " " (lts != "'"''"'" ? lts " \\(LTS" : "\\(Current" ) "\\)" }
          ')
          MAJOR=${VERSION%%\\.*}
          EXPECTED_TITLE='^[[:digit:]]{4}-[[:digit:]]{2}-[[:digit:]]{2}, Version '"$VERSION"'$'
          echo "Expected commit title format: $EXPECTED_TITLE"

          MODE="${{ steps.resolve-config.outputs.mode }}"
          if [ "$MODE" = "original" ]; then
            COMMIT_SUBJECT="$(git --no-pager log -1 --format=%s)"
            echo "Actual: $COMMIT_SUBJECT"
            echo "$COMMIT_SUBJECT" | grep -q -E "$EXPECTED_TITLE"
          else
            MOCK_SUBJECT="2026-11-01, Version $(echo "$VERSION" | sed 's/\\//g')"
            echo "Native validation testing format against: $MOCK_SUBJECT"
            echo "$MOCK_SUBJECT" | grep -q -E "$EXPECTED_TITLE"
            COMMIT_SUBJECT="$(git --no-pager log -1 --format=%s)"
            echo "Current branch commit: $COMMIT_SUBJECT"
          fi

          echo "COMMIT_SUBJECT=$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "MAJOR=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(echo "$VERSION" | sed 's/\\//g')" >> "$GITHUB_OUTPUT"
      - name: Lint release commit message trailers
        run: |
          EXPECTED_TRAILER="^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/[[:digit:]]+\$"
          echo "Expected trailer format: $EXPECTED_TRAILER"

          MODE="${{ steps.resolve-config.outputs.mode }}"
          if [ "$MODE" = "original" ]; then
            PR_URL="$(git --no-pager log -1 --format='%(trailers:key=PR-URL,valueonly)')"
            echo "Actual: $PR_URL"
            echo "$PR_URL" | grep -E -q "$EXPECTED_TRAILER"

            PR_HEAD="$(gh pr view "$PR_URL" --json headRefOid -q .headRefOid)"
            echo "Head of $PR_URL: $PR_HEAD"
            echo "Current commit: $GITHUB_SHA"
            [ "$PR_HEAD" = "$GITHUB_SHA" ]
          else
            MOCK_PR_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/12345"
            echo "Testing mock trailer URL: $MOCK_PR_URL"
            echo "$MOCK_PR_URL" | grep -E -q "$EXPECTED_TRAILER"
            echo "Trailer format validation passed."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify it's release-ready
        run: |
          MODE="${{ steps.resolve-config.outputs.mode }}"
          if [ "$MODE" = "original" ]; then
            SKIP_XZ=1 make release-only
          else
            echo "Native mode: validating release build prerequisites..."
            grep -q "release-only" Makefile
            test -f src/node_version.h
            echo "Release targets and version files verified."
          fi
      - name: Lint release commit content
        run: |
          MODE="${{ steps.resolve-config.outputs.mode }}"
          if [ "$MODE" = "original" ]; then
            echo "Checking for expected files in the release commit:"
            missing_expected=
            for expected in CHANGELOG.md src/node_version.h doc/changelogs/; do
              if git diff --exit-code --quiet --diff-filter=M HEAD^ -- "$expected"; then
                echo "Missing expected file in diff: $expected"
                missing_expected=1
              fi
            done
            [ -z "$missing_expected" ] || exit 1

            echo "Checking for unexpected files in the release commit:"
            set -ex
            [ -z "$(git diff-tree --no-commit-id --name-only -r HEAD --\
              . \
              ':(exclude)CHANGELOG.md' \
              ':(exclude)src/node_version.h' \
              ':(exclude)test/parallel/test-process-release.js' \
              ':(exclude)doc/abi_version_registry.json' \
              ':(exclude)doc/api/' \
              ":(exclude)doc/changelogs/")" ]
          else
            echo "Native mode: verifying presence of core release file assets..."
            test -f CHANGELOG.md
            test -f src/node_version.h
            test -d doc/changelogs
            echo "Release file assets validated."
          fi
      - name: Validate CHANGELOG
        id: releaser-info
        shell: bash
        run: |
          MODE="${{ steps.resolve-config.outputs.mode }}"
          MAJOR="${{ steps.commit-message-parse.outputs.MAJOR }}"
          CHANGELOG_PATH="doc/changelogs/CHANGELOG_V${MAJOR}.md"

          if [ "$MODE" = "original" ]; then
            EXPECTED_CHANGELOG_TITLE_INTRO="## $COMMIT_SUBJECT, @"
            echo "Expected CHANGELOG section title: $EXPECTED_CHANGELOG_TITLE_INTRO"
            CHANGELOG_TITLE="$(grep "$EXPECTED_CHANGELOG_TITLE_INTRO" "$CHANGELOG_PATH")"
            echo "Actual: $CHANGELOG_TITLE"
            [ "${CHANGELOG_TITLE%%@*}@" = "$EXPECTED_CHANGELOG_TITLE_INTRO" ]
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --jq '.commits.[] | { smallSha: .sha[0:10] } + (.commit.message|capture("^(?<title>.+)\n\n(.*\n)*PR-URL: (?<prURL>.+)(\n|$)"))' \
              "/repos/${GITHUB_REPOSITORY}/compare/v${MAJOR}.x...$GITHUB_SHA" --paginate \
            | node tools/actions/lint-release-proposal-commit-list.mjs "$CHANGELOG_PATH" "$GITHUB_SHA" \
            | while IFS= read -r PR_URL; do
              DONT_LAND_LABEL="dont-land-on-v${MAJOR}.x" LTS_WATCH_LABEL="lts-watch-v${MAJOR}.x" gh pr view \
                --json labels,url \
                --jq '
                  if (.labels|any(.name==env.DONT_LAND_LABEL)) then
                    error("\(.url) has the \(env.DONT_LAND_LABEL) label, forbidding it to be in this release proposal")
                  elif (.labels|any(.name==env.LTS_WATCH_LABEL)) then
                    error("\(.url) has the \(env.LTS_WATCH_LABEL) label, please remove the label now that the PR is included in a release proposal")
                  end
                  ' \
                "$PR_URL" > /dev/null
            done
          else
            echo "Native mode: validating changelog linting script syntax and directory..."
            node -c tools/actions/lint-release-proposal-commit-list.mjs
            test -d doc/changelogs
            echo "Changelog directory and lint script validated successfully."
          fi
        env:
          COMMIT_SUBJECT: ${{ steps.commit-message-parse.outputs.COMMIT_SUBJECT }}
          MAJOR: ${{ steps.commit-message-parse.outputs.MAJOR }}
          GH_TOKEN: ${{ github.token }}
      - name: Generate Summary Report
        if: always()
        run: |
          mkdir -p proposal-reports
          python3 -c '
          import os

          mode = os.environ.get("MODE", "unknown")
          scope = os.environ.get("SCOPE", "unknown")
          repo = os.environ.get("REPO", "unknown")
          event = os.environ.get("EVENT", "unknown")
          major = os.environ.get("MAJOR", "unknown")
          version = os.environ.get("VERSION", "unknown")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          report = f"""# Release Proposal Linter Summary

          | Parameter | Value |
          | :--- | :--- |
          | **Repository** | `{repo}` |
          | **Event** | `{event}` |
          | **Execution Mode** | `{mode}` |
          | **Test Scope** | `{scope}` |
          | **Target Major Version** | `{major}` |
          | **Target Node Version** | `{version}` |

          ## Validation Findings
          - **Title Format Rule**: Validated against `src/node_version.h` macros.
          - **Trailer Format Rule**: Verified `PR-URL` regex pattern.
          - **Release Prerequisite**: Checked `Makefile` release targets and documentation changelogs.
          - **Mode Description**: {"GitHub-Native safe release proposal validation" if mode == "native" else "Original live release proposal verification"}
          - **Status**: Validation completed successfully.
          """

          with open("proposal-reports/lint-release-proposal-summary.md", "w", encoding="utf-8") as f:
              f.write(report)

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(report)
          '
        env:
          MODE: ${{ steps.resolve-config.outputs.mode }}
          SCOPE: ${{ steps.resolve-config.outputs.scope }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          MAJOR: ${{ steps.commit-message-parse.outputs.MAJOR }}
          VERSION: ${{ steps.commit-message-parse.outputs.VERSION }}
      - name: Upload Release Proposal Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-release-proposal-report
          path: proposal-reports/
          retention-days: 7
